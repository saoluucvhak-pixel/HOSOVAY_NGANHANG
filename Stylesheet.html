<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap');

  :root {
    --sidebar-bg: #101A2C;
    --sidebar-bg-hover: #182640;
    --sidebar-active-bg: #1E2D4A;
    --sidebar-text: #8B96AC;
    --sidebar-text-active: #FFFFFF;
    --sidebar-border: #1E2A40;
    --accent: #C9A227;
    --accent-soft: rgba(201, 162, 39, 0.16);
    --primary: #1F4E78;
    --primary-dark: #163A5C;
    --primary-soft: #E8F0F7;
    --content-bg: #F2F4F8;
    --card-bg: #FFFFFF;
    --card-border: #E3E7EE;
    --text-primary: #16202E;
    --text-secondary: #66738A;
    --text-muted: #97A2B5;
    --success: #1B8354;
    --success-bg: #E8F6EF;
    --danger: #C0392B;
    --danger-bg: #FDECEA;
    --radius: 10px;
    --shadow-card: 0 1px 2px rgba(16, 26, 44, 0.04), 0 1px 3px rgba(16, 26, 44, 0.06);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Be Vietnam Pro', Arial, sans-serif;
    background: var(--content-bg);
    color: var(--text-primary);
    font-size: 13.5px;
  }
  .app-shell { display: flex; min-height: 100vh; }

  /* ===================== SIDEBAR ===================== */
  .sidebar {
    width: 246px; flex: 0 0 246px;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex; flex-direction: column;
    padding: 20px 14px;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; }
  .sidebar-brand .mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #8A6D14);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #16202E; font-size: 15px; flex: none;
  }
  .sidebar-brand .txt { line-height: 1.25; }
  .sidebar-brand .txt .l1 { font-weight: 700; font-size: 13.5px; color: #fff; }
  .sidebar-brand .txt .l2 { font-size: 10.5px; color: var(--sidebar-text); letter-spacing: .03em; }

  .sidebar-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: #5B6779; padding: 14px 12px 8px;
  }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    color: var(--sidebar-text); font-size: 13.5px; font-weight: 500;
    border: none; background: none; text-align: left; width: 100%;
    position: relative; transition: background .12s ease, color .12s ease;
  }
  .nav-item:hover { background: var(--sidebar-bg-hover); color: #fff; }
  .nav-item.active { background: var(--sidebar-active-bg); color: #fff; }
  .nav-item.active::before {
    content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .nav-item svg { flex: none; width: 18px; height: 18px; opacity: .9; }
  .nav-item .lbl { flex: 1; line-height: 1.3; }
  .nav-badge {
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
    background: #263248; color: #B7C1D4; min-width: 20px; text-align: center;
  }
  .nav-item.active .nav-badge { background: var(--accent-soft); color: var(--accent); }

  .sidebar-foot { margin-top: auto; padding: 12px 12px 2px; font-size: 10.5px; color: #4E5A6E; line-height: 1.5; }

  /* ===================== MAIN CONTENT ===================== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    background: var(--card-bg); border-bottom: 1px solid var(--card-border);
    padding: 16px 28px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  .topbar h1 { font-size: 17px; font-weight: 700; margin: 0; color: var(--text-primary); }
  .topbar .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .content-area { padding: 22px 28px 40px; max-width: 1320px; width: 100%; margin: 0 auto; }

  #msgBox:empty { display: none; }
  #msgBox { margin-bottom: 16px; }

  /* ===================== CARDS / FORMS (giữ tương thích class cũ) ===================== */
  h2 { color: var(--text-primary); margin: 0 0 4px; font-weight: 700; }
  h3 { color: var(--text-primary); border-bottom: none; padding-bottom: 0; margin: 0 0 16px; font-size: 14.5px; font-weight: 700; }
  h3::before { content: ''; display: inline-block; width: 3px; height: 14px; background: var(--primary); margin-right: 9px; border-radius: 2px; vertical-align: -1px; }
  .sub { display: none; }
  .card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow-card);
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }
  label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 12px; color: var(--text-secondary); }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #D7DCE5; border-radius: 7px;
    font-size: 13px; font-family: 'Be Vietnam Pro', Arial, sans-serif; color: var(--text-primary);
    background: #fff; transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
  }
  input[readonly] { background: #F5F7FA; color: var(--text-secondary); }
  input:disabled, select:disabled {
    background: #F5F7FA; color: var(--text-muted); cursor: not-allowed; border-color: #E3E7EE;
  }
  input::placeholder { color: var(--text-muted); }
  textarea { resize: vertical; }

  table.detail { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  table.detail th {
    background: #F6F8FB; color: var(--text-secondary); padding: 9px 8px; text-align: left;
    font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .02em;
    border-bottom: 1px solid var(--card-border);
  }
  table.detail td { padding: 8px; border-bottom: 1px solid #EEF1F5; vertical-align: middle; }
  table.detail tbody tr:hover { background: #FAFBFD; }
  table.detail input { font-size: 12.5px; padding: 6px 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 17px; border-radius: 7px; border: none; cursor: pointer;
    font-weight: 600; font-size: 13px; margin-right: 8px; margin-top: 6px;
    transition: filter .12s ease, transform .05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: #EEF1F6; color: var(--text-primary); }
  .btn-secondary:hover { filter: brightness(0.97); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { filter: brightness(1.08); }
  .btn-danger { background: var(--danger); color: #fff; padding: 6px 10px; font-size: 11.5px; }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .toolbar { text-align: right; margin-bottom: 8px; }
  .total-row { font-weight: 700; background: #F6F8FB; }
  .msg { padding: 11px 15px; border-radius: 8px; margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
  .msg-ok { background: var(--success-bg); color: #0F5C38; border: 1px solid #BEE8D3; }
  .msg-err { background: var(--danger-bg); color: #8E241A; border: 1px solid #F4C2BC; }
  .links a { display: block; margin: 4px 0; color: var(--primary); font-weight: 600; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .loading { display: none; color: var(--primary); font-style: italic; font-size: 12.5px; margin-top: 6px; }
  .spacer { height: 8px; }
  .hint { font-size: 11px; color: var(--text-muted); font-weight: 500; }

  /* trạng thái badge trong bảng danh sách hồ sơ */
  .trangthai-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .trangthai-chotaohoso { background: #FFF3D6; color: #8A5A00; }
  .trangthai-daotaohoso { background: #E4ECFB; color: #1F4E78; }
  .trangthai-daigiaingan { background: var(--success-bg); color: #0F5C38; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(16, 26, 44, 0.55);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-box {
    background: #fff; border-radius: 12px; padding: 20px 22px; width: 92%; max-width: 640px;
    max-height: 85vh; overflow: auto; box-shadow: 0 20px 60px rgba(16, 26, 44, 0.35);
  }
  .kh-dropdown {
    position: fixed; background: #fff; border: 1px solid var(--card-border); border-radius: 9px;
    max-height: 240px; overflow: auto; z-index: 2000; box-shadow: 0 12px 30px rgba(16, 26, 44, 0.18);
    font-size: 12.5px;
  }
  .kh-dropdown .kh-item { padding: 8px 11px; cursor: pointer; border-bottom: 1px solid #F1F3F7; }
  .kh-dropdown .kh-item:hover { background: var(--primary-soft); }
  .kh-dropdown .kh-empty { padding: 9px 11px; color: var(--text-muted); font-style: italic; }

  /* ===================== WIZARD NHIỀU BƯỚC (tạo/sửa hồ sơ giải ngân) ===================== */
  .wizard-steps { display: flex; position: relative; margin: 4px 0 32px; padding: 0 4px; }
  .wizard-steps::before {
    content: ''; position: absolute; top: 20px; left: 76px; right: 76px; height: 3px;
    background: var(--card-border); z-index: 0; border-radius: 3px;
  }
  .wizard-step {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;
    position: relative; z-index: 1; text-align: center; cursor: pointer;
  }
  .wizard-circle {
    width: 40px; height: 40px; border-radius: 50%; background: #fff;
    border: 3px solid var(--card-border); color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .wizard-label { font-size: 13px; font-weight: 700; color: var(--text-muted); letter-spacing: .01em; }
  .wizard-step.active .wizard-circle { background: var(--primary); border-color: var(--primary); color: #fff; transform: scale(1.08); box-shadow: 0 0 0 5px var(--primary-soft); }
  .wizard-step.active .wizard-label { color: var(--primary); }
  .wizard-step.done .wizard-circle { background: var(--success); border-color: var(--success); color: #fff; }
  .wizard-step.done .wizard-circle::after { content: '✓'; }
  .wizard-step.done .wizard-circle { font-size: 0; }
  .wizard-step.done .wizard-circle::after { font-size: 17px; }
  .wizard-step.done .wizard-label { color: var(--text-primary); }
  .wizard-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--card-border); }
  .wizard-summary {
    background: #F6F8FB; border: 1px solid var(--card-border); border-radius: 8px;
    padding: 14px 18px; font-size: 13px; line-height: 1.95; margin: 18px 0 4px;
  }
  .wizard-summary b { color: var(--text-primary); }
  .wizard-summary .ws-warn { color: var(--danger); font-weight: 600; }
  .wizard-actions {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    gap: 12px; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--card-border);
  }
  .wizard-actions-left { display: flex; gap: 8px; flex-wrap: wrap; }
  .wizard-actions .btn { margin: 0; }
  .btn-approve {
    background: var(--success); color: #fff; font-weight: 700; font-size: 14px;
    padding: 12px 26px; box-shadow: 0 2px 6px rgba(27, 131, 84, 0.35);
  }
  .btn-approve:hover { filter: brightness(1.08); }

  /* ===================== NHÓM SIDEBAR PHỤ (vd "DANH MỤC") ===================== */
  .sidebar-label.sub-label { margin-top: 4px; }
  .sidebar-divider { height: 1px; background: var(--sidebar-border); margin: 10px 10px 2px; }

  .empty-state {
    text-align: center; padding: 48px 20px; border: 1px dashed var(--card-border); border-radius: 10px;
    background: #FAFBFD;
  }
  .empty-state-icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
  .empty-state-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  .empty-state .btn { margin: 0; }

  /* ===================== HEADER DANH MỤC KIỂU "DANH SÁCH CHỜ DUYỆT" (ảnh mẫu) ===================== */
  .dm-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .dm-header h3 { margin: 0 0 4px; }
  .dm-header-actions { display: flex; gap: 8px; flex: none; }
  .dm-header-actions .btn { margin: 0; }
  .btn-dark { background: var(--sidebar-bg); color: #fff; }
  .btn-dark:hover { filter: brightness(1.25); }

  .pill-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px; border-radius: 20px; border: 1px solid var(--card-border);
    background: #fff; color: var(--text-secondary); font-size: 12.5px; font-weight: 600;
    cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .pill:hover { background: #F6F8FB; }
  .pill.active { background: var(--sidebar-bg); border-color: var(--sidebar-bg); color: #fff; }
  .pill-badge {
    background: rgba(0,0,0,0.12); border-radius: 20px; padding: 1px 8px; font-size: 11px; font-weight: 700;
  }
  .pill.active .pill-badge { background: var(--accent); color: #16202E; }

  table.table-danhmuc td.dm-col-check, table.table-danhmuc th.dm-col-check { width: 34px; text-align: center; }
  table.table-danhmuc td.dm-col-xem { width: 54px; text-align: right; }
  table.table-danhmuc td.dm-col-xem a { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: none; }
  table.table-danhmuc td.dm-col-xem a:hover { text-decoration: underline; }

  /* ===================== BẢNG DANH MỤC (kiểu bảng danh sách) ===================== */
  .tip-banner {
    display: flex; align-items: flex-start; gap: 9px;
    background: #FFF7E6; border: 1px solid #F3D999; color: #7A5A05;
    padding: 11px 15px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; margin-bottom: 16px;
  }
  .tip-banner b { color: #5C4204; }

  .toolbar-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .toolbar-row input[type="text"], .toolbar-row input:not([type]) {
    flex: 1 1 260px; min-width: 200px;
  }
  .toolbar-row .btn { margin: 0; flex: none; }

  table.table-danhmuc { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.table-danhmuc thead th {
    background: var(--sidebar-bg); color: #fff; text-align: left;
    padding: 10px 12px; font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: .03em; border: none;
  }
  table.table-danhmuc tbody td {
    padding: 10px 12px; border-bottom: 1px solid #EEF1F5; vertical-align: middle; color: var(--text-primary);
  }
  table.table-danhmuc tbody tr { cursor: pointer; transition: background .1s ease; }
  table.table-danhmuc tbody tr:hover { background: var(--primary-soft); }
  table.table-danhmuc tbody tr.row-active {
    background: var(--accent-soft);
    box-shadow: inset 3px 0 0 0 var(--accent);
  }
  table.table-danhmuc tbody tr.row-empty { cursor: default; }
  table.table-danhmuc tbody tr.row-empty:hover { background: transparent; }
  .danhmuc-wrap { overflow-x: auto; border: 1px solid var(--card-border); border-radius: 8px; }

  .card-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-title-row h3 { margin: 0; }
  .form-section-label {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); margin: 20px 0 10px;
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 900px) {
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; flex: none; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 12px; }
    .sidebar-brand { padding: 0 10px 0 0; }
    .sidebar-label { display: none; }
    .sidebar-nav { flex-direction: row; }
    .nav-item.active::before { left: 6px; right: 6px; top: auto; bottom: -2px; height: 3px; width: auto; border-radius: 3px 3px 0 0; }
    .sidebar-foot { display: none; }
    .grid, .grid2 { grid-template-columns: 1fr; }
    .content-area { padding: 16px; }
  }
</style>
