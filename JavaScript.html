<script>
  var DS_CONG_TY = [];
  var DS_HOP_DONG = [];
  var DS_HOP_DONG_ALL = [];
  var DS_HO_SO = [];
  var DS_KHACH_HANG = [];
  var MA_HO_SO_DANG_SUA = '';
  var MA_CTY_DANG_SUA = '';
  var MA_HD_DANG_SUA = '';
  var MA_KH_DANG_SUA = '';
  var TRANG_THAI_HIEN_TAI = '';
  var NGAY_HOM_NAY_SERVER = '';
  var DEM_DONG = 0;
  var FORM_DIRTY = false;
  var BUOC_HOSO_HIEN_TAI = 1;
  var BUOC_HOSO_TOI_DA_ = 1; // bước xa nhất đã từng đến — dùng để cho phép nhảy bước tới/lùi tự do
  var CHON_DANHMUC_ = { congty: {}, hopdong: {}, khachhang: {} };
  var TRANG_THAI_LOC_HOSO = '';

  window.onerror = function (msg, url, line, col, err) {
    var box = document.getElementById('msgBox');
    if (box) {
      box.innerHTML = '<div class="msg msg-err"><b>⚠️ Lỗi JavaScript:</b> ' + esc(String(msg)) +
        ' (dòng ' + line + ')<br><span class="hint">Chụp lại dòng này gửi cho lập trình viên để sửa.</span></div>';
    }
    console.error("Lỗi JS: ", msg, err);
    return false;
  };

  document.addEventListener('DOMContentLoaded', function () {
    taiDuLieuBanDau();
    var vungTheoDoi = document.getElementById('tab-hoso');
    if (vungTheoDoi) {
      vungTheoDoi.addEventListener('input', function () { FORM_DIRTY = true; });
      vungTheoDoi.addEventListener('change', function () { FORM_DIRTY = true; });
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (FORM_DIRTY) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('ct-ten')) return;
    var dd = document.getElementById('ddKhachHang');
    if (dd && !dd.contains(e.target)) dd.style.display = 'none';
  });

  var DA_KHOI_TAO_BAOCAO = false;

  var TIEU_DE_TAB = {
    hoso: 'Hồ sơ giải ngân',
    congty: 'Danh mục — Công ty',
    hopdong: 'Danh mục — Hợp đồng vay',
    khachhang: 'Danh mục — Khách hàng',
    baocao: 'Báo cáo tiền vay',
    caidat: 'Cài đặt hệ thống'
  };

  var DA_KHOI_TAO_CAIDAT = false;

  function chuyenTab(ten) {
    ['hoso', 'congty', 'hopdong', 'khachhang', 'baocao', 'caidat'].forEach(function (t) {
      var el = document.getElementById('tab-' + t);
      if (el) el.style.display = (t === ten) ? 'block' : 'none';
      var btn = document.getElementById('tabBtn-' + t);
      if (btn) btn.classList.toggle('active', t === ten);
    });
    var elTieuDe = document.getElementById('pageTitle');
    if (elTieuDe) elTieuDe.textContent = TIEU_DE_TAB[ten] || '';
    if (ten === 'baocao' && !DA_KHOI_TAO_BAOCAO) {
      DA_KHOI_TAO_BAOCAO = true;
      var homNay = NGAY_HOM_NAY_SERVER || toInputDate(new Date());
      document.getElementById('bc_tuNgay').value = '';
      document.getElementById('bc_denNgay').value = homNay;
      locBaoCaoTienVay();
    }
    if (ten === 'caidat' && !DA_KHOI_TAO_CAIDAT) {
      DA_KHOI_TAO_CAIDAT = true;
      napCauHinhClick();
    }
  }

  function capNhatBadgeSidebar_() {
    var b;
    b = document.getElementById('badge-hoso'); if (b) b.textContent = DS_HO_SO.length;
    b = document.getElementById('badge-congty'); if (b) b.textContent = DS_CONG_TY.length;
    b = document.getElementById('badge-hopdong'); if (b) b.textContent = DS_HOP_DONG_ALL.length;
    b = document.getElementById('badge-khachhang'); if (b) b.textContent = DS_KHACH_HANG.length;
  }

  function napDropdownCongTy_(selectId, placeholder) {
    var sel = document.getElementById(selectId);
    if (!sel) return;
    sel.options.length = 0;
    sel.add(new Option(placeholder, ""));
    DS_CONG_TY.forEach(function (c) {
      sel.add(new Option(c.TenCty, c.MaCty));
    });
  }

  function napDanhMucCoBan(callback) {
    google.script.run.withSuccessHandler(function (list) {
      DS_CONG_TY = list || [];
      napDropdownCongTy_('selCongTy', '-- Chọn công ty --');
      napDropdownCongTy_('selCongTyEdit', '-- Tạo công ty mới --');
      napDropdownCongTy_('hd_maCty', '-- Chọn công ty --');
      napDropdownCongTy_('loc_congTy', '-- Tất cả --');
      
      var elCT = document.getElementById('thongBaoSoCongTy');
      if (elCT) elCT.textContent = '(máy chủ trả về ' + DS_CONG_TY.length + ' công ty)';

      var selGoiY = document.getElementById('selNguoiLapBieuGoiY');
      if (selGoiY) {
        selGoiY.options.length = 0;
        selGoiY.add(new Option("▾", ""));
        var daThay = {};
        DS_CONG_TY.forEach(function (c) {
          var ten = (c.NguoiLapBieu || '').trim();
          if (!ten || daThay[ten]) return;
          daThay[ten] = true;
          selGoiY.add(new Option(ten, ten));
        });
      }

      google.script.run.withSuccessHandler(function (list2) {
        DS_HOP_DONG_ALL = list2 || [];
        var sel = document.getElementById('selHopDongEdit');
        var selLoc = document.getElementById('loc_hopDong');
        if (sel) { sel.options.length = 0; sel.add(new Option("-- Tạo hợp đồng mới --", "")); }
        if (selLoc) { selLoc.options.length = 0; selLoc.add(new Option("-- Tất cả --", "")); }
        
        DS_HOP_DONG_ALL.forEach(function (h) {
          // Lọc cực kỳ an toàn, triệt tiêu mọi khoảng trắng
          var congTy = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === String(h.MaCty).trim(); })[0];
          var ten = congTy ? congTy.TenCty : h.MaCty;
          var label = h.SoHopDong + ' - ' + ten;
          if (sel) sel.add(new Option(label, h.MaHD));
          if (selLoc) selLoc.add(new Option(label, h.MaHD));
        });

        google.script.run.withSuccessHandler(function (list3) {
          DS_KHACH_HANG = list3 || [];
          var selKH = document.getElementById('selKhachHangEdit');
          var dl = document.getElementById('dsKhachHang');
          if (selKH) { selKH.options.length = 0; selKH.add(new Option("-- Tạo khách hàng mới --", "")); }
          if (dl) dl.innerHTML = '';
          
          DS_KHACH_HANG.forEach(function (k) {
            if (selKH) selKH.add(new Option(k.TenKhachHang + (k.MaSoThue ? ' - MST ' + k.MaSoThue : ''), k.MaKH));
            if (dl) {
              var opt = document.createElement('option');
              opt.value = k.TenKhachHang;
              dl.appendChild(opt);
            }
          });
          
          capNhatBadgeSidebar_();
          renderBangCongTy_();
          renderBangHopDong_();
          renderBangKhachHang_();
          capNhatNutXoaHangLoat_('congty');
          capNhatNutXoaHangLoat_('hopdong');
          capNhatNutXoaHangLoat_('khachhang');
          if (callback) callback();
        }).withFailureHandler(function (err) { if (callback) callback(); baoLoi(err); }).layDanhSachKhachHang();
      }).withFailureHandler(function (err) { baoLoi(err); }).layDanhSachHopDong();
    }).withFailureHandler(function (err) {
      var elCT = document.getElementById('thongBaoSoCongTy');
      if (elCT) elCT.innerHTML = '<b style="color:#b71c1c;">LỖI: ' + esc((err && err.message) || String(err)) + '</b>';
      baoLoi(err);
    }).layDanhSachCongTy();
  }

  // =========================================================================
  // BẢNG DANH SÁCH (kiểu ảnh mẫu) — Công ty / Hợp đồng vay / Khách hàng
  // Bấm vào 1 dòng trong bảng để sửa (dùng lại đúng logic onChon*Edit() hiện có
  // thông qua các <select> đã có sẵn, chỉ ẩn khỏi giao diện chứ không xoá).
  // =========================================================================

  function trongBangDs_(soCot, chuoi) {
    return '<tr class="row-empty"><td colspan="' + soCot + '" class="hint" style="text-align:center; padding:16px;">' + esc(chuoi) + '</td></tr>';
  }

  var BANG_ID_SANG_LOAI_ = { tbl_dsCongTy: 'congty', tbl_dsHopDong: 'hopdong', tbl_dsKhachHang: 'khachhang' };
  var LOAI_SANG_NUT_XOA_ = { congty: 'btnXoaCongTy', hopdong: 'btnXoaHopDong', khachhang: 'btnXoaKhachHang' };
  var LOAI_SANG_DEM_ = { congty: 'demChonCongTy', hopdong: 'demChonHopDong', khachhang: 'demChonKhachHang' };

  /** Header checkbox "chọn tất cả" cho bảng danh mục. */
  function toggleChonTatCaDanhMuc_(headerCb, tableId) {
    var loai = BANG_ID_SANG_LOAI_[tableId];
    var checked = headerCb.checked;
    document.querySelectorAll('#' + tableId + ' tbody input[type="checkbox"][data-ma]').forEach(function (cb) {
      cb.checked = checked;
      var ma = cb.getAttribute('data-ma');
      if (checked) CHON_DANHMUC_[loai][ma] = true; else delete CHON_DANHMUC_[loai][ma];
    });
    capNhatNutXoaHangLoat_(loai);
  }

  /** Checkbox từng dòng trong bảng danh mục — cập nhật danh sách đang chọn + nút "Xoá đã chọn". */
  function toggleChonDongDanhMuc_(cb, loai, ma) {
    if (cb.checked) CHON_DANHMUC_[loai][ma] = true; else delete CHON_DANHMUC_[loai][ma];
    capNhatNutXoaHangLoat_(loai);
  }

  function capNhatNutXoaHangLoat_(loai) {
    var soChon = Object.keys(CHON_DANHMUC_[loai]).length;
    var btn = document.getElementById(LOAI_SANG_NUT_XOA_[loai]);
    var demEl = document.getElementById(LOAI_SANG_DEM_[loai]);
    if (demEl) demEl.textContent = soChon;
    if (btn) btn.style.display = soChon > 0 ? 'inline-flex' : 'none';
  }

  /** Hiển thị kết quả xoá hàng loạt — báo rõ mục nào bị bỏ qua vì đang được dùng ở nơi khác. */
  function baoKetQuaXoaHangLoat_(kq, tenLoai) {
    var soDaXoa = (kq.daXoa || []).length;
    var soBoQua = (kq.boQua || []).length;
    if (soBoQua === 0) {
      baoThanhCong('Đã xoá ' + soDaXoa + ' ' + tenLoai + '.');
    } else {
      var chiTiet = kq.boQua.map(function (b) { return b.ma + ' (' + b.lyDo + ')'; }).join('; ');
      baoLoi('Đã xoá ' + soDaXoa + ' ' + tenLoai + '. Bỏ qua ' + soBoQua + ' mục đang được sử dụng ở nơi khác: ' + chiTiet);
    }
  }

  function xoaHangLoatCongTyClick() {
    var ds = Object.keys(CHON_DANHMUC_.congty);
    if (!ds.length) return;
    hoiXacNhan('Xoá ' + ds.length + ' công ty đã chọn? Công ty đang có hợp đồng vay gắn với sẽ tự động được bỏ qua (không xoá). Thao tác này không thể hoàn tác.', function () {
      hienLoading(true);
      google.script.run.withSuccessHandler(function (kq) {
        hienLoading(false);
        if (MA_CTY_DANG_SUA && (kq.daXoa || []).indexOf(MA_CTY_DANG_SUA) >= 0) themMoiCongTyClick();
        CHON_DANHMUC_.congty = {};
        capNhatNutXoaHangLoat_('congty');
        napDanhMucCoBan();
        baoKetQuaXoaHangLoat_(kq, 'công ty');
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).xoaCongTyNhieu(ds);
    });
  }

  function xoaHangLoatHopDongClick() {
    var ds = Object.keys(CHON_DANHMUC_.hopdong);
    if (!ds.length) return;
    hoiXacNhan('Xoá ' + ds.length + ' hợp đồng đã chọn? Hợp đồng đang có hồ sơ giải ngân gắn với sẽ tự động được bỏ qua (không xoá). Thao tác này không thể hoàn tác.', function () {
      hienLoading(true);
      google.script.run.withSuccessHandler(function (kq) {
        hienLoading(false);
        if (MA_HD_DANG_SUA && (kq.daXoa || []).indexOf(MA_HD_DANG_SUA) >= 0) themMoiHopDongClick();
        CHON_DANHMUC_.hopdong = {};
        capNhatNutXoaHangLoat_('hopdong');
        napDanhMucCoBan();
        baoKetQuaXoaHangLoat_(kq, 'hợp đồng');
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).xoaHopDongNhieu(ds);
    });
  }

  function xoaHangLoatKhachHangClick() {
    var ds = Object.keys(CHON_DANHMUC_.khachhang);
    if (!ds.length) return;
    hoiXacNhan('Xoá ' + ds.length + ' khách hàng đã chọn? Thao tác này không thể hoàn tác.', function () {
      hienLoading(true);
      google.script.run.withSuccessHandler(function (kq) {
        hienLoading(false);
        if (MA_KH_DANG_SUA && (kq.daXoa || []).indexOf(MA_KH_DANG_SUA) >= 0) themMoiKhachHangClick();
        CHON_DANHMUC_.khachhang = {};
        capNhatNutXoaHangLoat_('khachhang');
        napDanhMucCoBan();
        baoKetQuaXoaHangLoat_(kq, 'khách hàng');
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).xoaKhachHangNhieu(ds);
    });
  }

  function renderBangCongTy_() {
    var tbody = document.getElementById('tbody_dsCongTy');
    if (!tbody) return;
    var tk = xoaDauVN((document.getElementById('timCongTyEdit') || {}).value || '');
    var ds = DS_CONG_TY.filter(function (c) { return !tk || xoaDauVN(c.TenCty).indexOf(tk) >= 0; });
    var badge = document.getElementById('pillDem-congty');
    if (badge) badge.textContent = DS_CONG_TY.length;
    if (!ds.length) { tbody.innerHTML = trongBangDs_(7, 'Chưa có công ty nào khớp — bấm "+ Tạo Mới" để tạo.'); return; }
    tbody.innerHTML = ds.map(function (c) {
      var active = String(c.MaCty).trim() === String(MA_CTY_DANG_SUA).trim() ? ' row-active' : '';
      return '<tr class="' + active + '" onclick="chonCongTyTuBang_(\'' + esc(c.MaCty) + '\')">' +
        '<td class="dm-col-check"><input type="checkbox" data-ma="' + esc(c.MaCty) + '" onclick="event.stopPropagation(); toggleChonDongDanhMuc_(this,\'congty\',\'' + esc(c.MaCty) + '\')" ' + (CHON_DANHMUC_.congty[c.MaCty] ? 'checked' : '') + '></td>' +
        '<td>' + esc(c.MaCty) + '</td>' +
        '<td><b>' + esc(c.TenCty) + '</b>' + (c.dangSuDung ? ' <span class="hint" title="Đã có hồ sơ giải ngân gắn với hợp đồng của công ty này">🔒</span>' : '') + '</td>' +
        '<td>' + esc(c.MaCIF) + '</td>' +
        '<td>' + esc(c.DienThoai) + '</td>' +
        '<td>' + esc(c.NguoiDaiDien) + '</td>' +
        '<td class="dm-col-xem"><a onclick="event.stopPropagation(); chonCongTyTuBang_(\'' + esc(c.MaCty) + '\')">Xem</a></td>' +
        '</tr>';
    }).join('');
  }

  function chonCongTyTuBang_(maCty) {
    var sel = document.getElementById('selCongTyEdit');
    if (sel) sel.value = maCty;
    onChonCongTyEdit();
    renderBangCongTy_();
    moModalCongTy_();
  }

  function themMoiCongTyClick() {
    var sel = document.getElementById('selCongTyEdit');
    if (sel) sel.value = '';
    onChonCongTyEdit();
    renderBangCongTy_();
    moModalCongTy_();
    var el = document.getElementById('ct_tenCty');
    if (el) el.focus();
  }

  function renderBangHopDong_() {
    var tbody = document.getElementById('tbody_dsHopDong');
    if (!tbody) return;
    var tk = xoaDauVN((document.getElementById('timHopDongEdit') || {}).value || '');
    var ds = DS_HOP_DONG_ALL.filter(function (h) {
      if (!tk) return true;
      var congTy = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === String(h.MaCty).trim(); })[0];
      var ten = congTy ? congTy.TenCty : '';
      return xoaDauVN(h.SoHopDong).indexOf(tk) >= 0 || xoaDauVN(ten).indexOf(tk) >= 0;
    });
    var badge = document.getElementById('pillDem-hopdong');
    if (badge) badge.textContent = DS_HOP_DONG_ALL.length;
    if (!ds.length) { tbody.innerHTML = trongBangDs_(7, 'Chưa có hợp đồng nào khớp — bấm "+ Tạo Mới" để tạo.'); return; }
    tbody.innerHTML = ds.map(function (h) {
      var congTy = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === String(h.MaCty).trim(); })[0];
      var active = String(h.MaHD).trim() === String(MA_HD_DANG_SUA).trim() ? ' row-active' : '';
      return '<tr class="' + active + '" onclick="chonHopDongTuBang_(\'' + esc(h.MaHD) + '\')">' +
        '<td class="dm-col-check"><input type="checkbox" data-ma="' + esc(h.MaHD) + '" onclick="event.stopPropagation(); toggleChonDongDanhMuc_(this,\'hopdong\',\'' + esc(h.MaHD) + '\')" ' + (CHON_DANHMUC_.hopdong[h.MaHD] ? 'checked' : '') + '></td>' +
        '<td><b>' + esc(h.SoHopDong) + '</b>' + (h.dangSuDung ? ' <span class="hint" title="Đã có hồ sơ giải ngân gắn vào">🔒</span>' : '') + '</td>' +
        '<td>' + esc(congTy ? congTy.TenCty : h.MaCty) + '</td>' +
        '<td>' + esc(h.TenNganHang) + (h.ChiNhanh ? ' — ' + esc(h.ChiNhanh) : '') + '</td>' +
        '<td>' + (h.HanMucVay ? Number(h.HanMucVay).toLocaleString('vi-VN') : '') + '</td>' +
        '<td>' + esc(h['LaiSuatTrongHan_%']) + (h['LaiSuatTrongHan_%'] ? '%/năm' : '') + '</td>' +
        '<td class="dm-col-xem"><a onclick="event.stopPropagation(); chonHopDongTuBang_(\'' + esc(h.MaHD) + '\')">Xem</a></td>' +
        '</tr>';
    }).join('');
  }

  function chonHopDongTuBang_(maHD) {
    var sel = document.getElementById('selHopDongEdit');
    if (sel) sel.value = maHD;
    onChonHopDongEdit();
    renderBangHopDong_();
    moModalHopDong_();
  }

  function themMoiHopDongClick() {
    var sel = document.getElementById('selHopDongEdit');
    if (sel) sel.value = '';
    onChonHopDongEdit();
    renderBangHopDong_();
    moModalHopDong_();
    var el = document.getElementById('hd_soHopDong');
    if (el) el.focus();
  }

  function renderBangKhachHang_() {
    var tbody = document.getElementById('tbody_dsKhachHang');
    if (!tbody) return;
    var tk = xoaDauVN((document.getElementById('timKhachHangEdit') || {}).value || '');
    var ds = DS_KHACH_HANG.filter(function (k) { return !tk || xoaDauVN(k.TenKhachHang).indexOf(tk) >= 0; });
    var badge = document.getElementById('pillDem-khachhang');
    if (badge) badge.textContent = DS_KHACH_HANG.length;
    if (!ds.length) { tbody.innerHTML = trongBangDs_(7, 'Chưa có khách hàng nào khớp — bấm "+ Tạo Mới" để tạo.'); return; }
    tbody.innerHTML = ds.map(function (k) {
      var active = String(k.MaKH).trim() === String(MA_KH_DANG_SUA).trim() ? ' row-active' : '';
      return '<tr class="' + active + '" onclick="chonKhachHangTuBang_(\'' + esc(k.MaKH) + '\')">' +
        '<td class="dm-col-check"><input type="checkbox" data-ma="' + esc(k.MaKH) + '" onclick="event.stopPropagation(); toggleChonDongDanhMuc_(this,\'khachhang\',\'' + esc(k.MaKH) + '\')" ' + (CHON_DANHMUC_.khachhang[k.MaKH] ? 'checked' : '') + '></td>' +
        '<td>' + esc(k.MaKH) + '</td>' +
        '<td><b>' + esc(k.TenKhachHang) + '</b></td>' +
        '<td>' + esc(k.MaSoThue) + '</td>' +
        '<td>' + esc(k.SoTaiKhoan) + '</td>' +
        '<td>' + esc(k.TaiNganHang) + '</td>' +
        '<td class="dm-col-xem"><a onclick="event.stopPropagation(); chonKhachHangTuBang_(\'' + esc(k.MaKH) + '\')">Xem</a></td>' +
        '</tr>';
    }).join('');
  }

  function chonKhachHangTuBang_(maKH) {
    var sel = document.getElementById('selKhachHangEdit');
    if (sel) sel.value = maKH;
    onChonKhachHangEdit();
    renderBangKhachHang_();
    moModalKhachHang_();
  }

  function themMoiKhachHangClick() {
    var sel = document.getElementById('selKhachHangEdit');
    if (sel) sel.value = '';
    onChonKhachHangEdit();
    renderBangKhachHang_();
    moModalKhachHang_();
    var el = document.getElementById('kh_tenKhachHang');
    if (el) el.focus();
  }

  function moModalKhachHang_() {
    var m = document.getElementById('modalKhachHang');
    if (m) m.style.display = 'flex';
  }

  function dongModalKhachHang_() {
    var m = document.getElementById('modalKhachHang');
    if (m) m.style.display = 'none';
  }

  function xoaKhachHangTuModal_() {
    if (!MA_KH_DANG_SUA) return;
    var ma = MA_KH_DANG_SUA;
    hoiXacNhan('Xoá khách hàng ' + ma + '? Thao tác này không thể hoàn tác.', function () {
      hienLoading(true);
      google.script.run.withSuccessHandler(function (kq) {
        hienLoading(false);
        dongModalKhachHang_();
        napDanhMucCoBan();
        baoKetQuaXoaHangLoat_(kq, 'khách hàng');
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).xoaKhachHangNhieu([ma]);
    });
  }

  function taiDuLieuBanDau() {
    hienLoading(true);
    google.script.run.withSuccessHandler(function (ngay) {
      NGAY_HOM_NAY_SERVER = ngay || '';
      khoiTaoSauKhiCoNgay_();
    }).withFailureHandler(function () {
      NGAY_HOM_NAY_SERVER = '';
      khoiTaoSauKhiCoNgay_();
    }).layNgayHomNay();
  }

  function khoiTaoSauKhiCoNgay_() {
    napDanhMucCoBan(function () { onChonCongTy(); });
    datNgayLocMacDinh();
    locDanhSachHoSoClick();
    resetFormMoi();
    hienLoading(false);
  }

  function datNgayLocMacDinh() {
    var homNay = NGAY_HOM_NAY_SERVER || toInputDate(new Date());
    var d = new Date(homNay + 'T00:00:00');
    var dauThang = new Date(d.getFullYear(), d.getMonth(), 1);
    var elTu = document.getElementById('loc_tuNgay');
    var elDen = document.getElementById('loc_denNgay');
    if (elTu) elTu.value = toInputDate(dauThang);
    if (elDen) elDen.value = homNay;
  }

  function datNgayMacDinh() {
    var homNay = NGAY_HOM_NAY_SERVER || toInputDate(new Date());
    document.getElementById('ngayGiayNhanNo').value = homNay;
    document.getElementById('ngayGiaiNgan').value = homNay;
    tinhNgayDenHan();
  }

  // =========================================================================
  // WIZARD 3 BƯỚC: Công ty → Giải ngân (Giấy nhận nợ) → Chi tiết giải ngân (Thụ hưởng) + Duyệt
  // =========================================================================

  function chuyenBuocHoSo_(buocMoi, opts) {
    opts = opts || {};
    if (buocMoi > BUOC_HOSO_HIEN_TAI && !opts.boQuaKiemTra) {
      if (BUOC_HOSO_HIEN_TAI === 1 && !xacThucBuoc1HoSo_()) return;
      if (BUOC_HOSO_HIEN_TAI === 2 && !xacThucBuoc2HoSo_()) return;
    }
    BUOC_HOSO_HIEN_TAI = buocMoi;
    if (buocMoi > BUOC_HOSO_TOI_DA_) BUOC_HOSO_TOI_DA_ = buocMoi;
    [1, 2, 3].forEach(function (i) {
      var el = document.getElementById('hoSoBuoc' + i);
      if (el) el.style.display = (i === buocMoi) ? 'block' : 'none';
      var stepEl = document.querySelector('#hoSoWizardSteps .wizard-step[data-step="' + i + '"]');
      if (stepEl) {
        stepEl.classList.toggle('active', i === buocMoi);
        stepEl.classList.toggle('done', i <= BUOC_HOSO_TOI_DA_ && i !== buocMoi);
      }
    });
    if (buocMoi === 3) renderTomTatBuoc3_();
    var wiz = document.getElementById('wizardHoSo');
    if (wiz) wiz.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /** Cho phép bấm thẳng vào số bước để nhảy tới/lùi TỰ DO trong phạm vi các bước đã từng đi qua
   *  (không cho nhảy vượt bước chưa từng đến/chưa xác thực). */
  function nhayBuocHoSo_(buoc) {
    if (buoc <= BUOC_HOSO_TOI_DA_) chuyenBuocHoSo_(buoc, { boQuaKiemTra: true });
  }

  function xacThucBuoc1HoSo_() {
    var maCty = document.getElementById('selCongTy').value;
    var maHD = document.getElementById('selHopDong').value;
    if (!maCty) { baoLoi('Vui lòng chọn Công ty vay vốn trước khi tiếp tục.'); return false; }
    if (!maHD) { baoLoi('Vui lòng chọn Hợp đồng cho vay theo hạn mức trước khi tiếp tục.'); return false; }
    return true;
  }

  function xacThucBuoc2HoSo_() {
    var soGNN = document.getElementById('soGiayNhanNo').value.trim();
    if (!soGNN) { baoLoi('Vui lòng nhập Số giấy nhận nợ trước khi tiếp tục.'); return false; }
    return true;
  }

  function renderTomTatBuoc3_() {
    var el = document.getElementById('tomTatBuoc3');
    if (!el) return;
    var maCty = document.getElementById('selCongTy').value;
    var cty = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === String(maCty).trim(); })[0];
    var maHD = document.getElementById('selHopDong').value;
    var hd = DS_HOP_DONG.filter(function (h) { return String(h.MaHD).trim() === String(maHD).trim(); })[0];
    var soDong = document.querySelectorAll('#tbodyChiTiet tr').length;
    var tong = document.getElementById('tongTien') ? document.getElementById('tongTien').textContent : '0';

    el.innerHTML =
      '<div><b>Công ty vay vốn:</b> ' + esc(cty ? cty.TenCty : '— chưa chọn —') + '</div>' +
      '<div><b>Hợp đồng vay:</b> ' + esc(hd ? hd.SoHopDong : '— chưa chọn —') + '</div>' +
      '<div><b>Số giấy nhận nợ:</b> ' + esc(document.getElementById('soGiayNhanNo').value || '— chưa nhập —') + '</div>' +
      '<div><b>Ngày giải ngân:</b> ' + esc(document.getElementById('ngayGiaiNgan').value || '—') + '</div>' +
      '<div><b>Số dòng thụ hưởng:</b> ' + soDong + ' dòng — <b>Tổng tiền:</b> ' + tong + ' VND</div>';
  }

  function resetFormMoi() {
    MA_HO_SO_DANG_SUA = '';
    TRANG_THAI_HIEN_TAI = '';
    BUOC_HOSO_TOI_DA_ = 1;
    var selCty = document.getElementById('selCongTy');
    if (selCty) {
      selCty.value = '';
      onChonCongTy();
    }
    document.getElementById('soGiayNhanNo').value = '';
    datNgayMacDinh();
    document.getElementById('duNoHienTai').value = '0';
    document.getElementById('soTienNhanNoLanNay').value = '0';
    document.getElementById('phuongThucThanhToan').value = 'Chuyển khoản';
    document.getElementById('thoiHanChoVayNgay').value = '';
    document.getElementById('soThamChieu').value = '';
    document.getElementById('mucDichSuDungVon').value = '';
    document.getElementById('nguoiLapBieu').value = '';
    document.getElementById('taiLieuChungMinhMucDich').value = '';
    document.getElementById('linksBox').innerHTML = '';

    document.getElementById('tbodyChiTiet').innerHTML = '';
    DEM_DONG = 0;
    themDong(); themDong(); themDong();
    capNhatTongTien();
    capNhatTrangThaiHienThi_();
    apDungKhoaFormTheoTrangThai();
    chuyenBuocHoSo_(1, { boQuaKiemTra: true });
    FORM_DIRTY = false;
  }

  function themMoiHoSoClick() {
    resetFormMoi();
    moHoSoFormView_('Tạo Hồ Sơ Giải Ngân');
    baoThanhCong('Đã mở form trống — điền thông tin qua từng bước rồi bấm "Duyệt" hoặc "Lưu (chưa duyệt)" ở Bước 3.');
  }

  function locDanhSachHoSoClick() {
    var boLoc = {
      maHoSo: document.getElementById('loc_maHoSo').value.trim(),
      tuNgay: document.getElementById('loc_tuNgay').value,
      denNgay: document.getElementById('loc_denNgay').value,
      tenNguoiHuong: document.getElementById('loc_tenNguoiHuong').value.trim(),
      maCty: document.getElementById('loc_congTy').value,
      maHD: document.getElementById('loc_hopDong').value
    };
    var thongBao = document.getElementById('thongBaoSoHoSo');
    if (thongBao) thongBao.textContent = 'Đang tải...';
    google.script.run.withSuccessHandler(function (list) {
      DS_HO_SO = list || [];
      renderBangHoSo_();
      capNhatBadgeSidebar_();
      if (thongBao) thongBao.textContent = '(tìm thấy ' + DS_HO_SO.length + ' hồ sơ)';
    }).withFailureHandler(function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      if (thongBao) thongBao.innerHTML = '<b style="color:#b71c1c;">LỖI: ' + esc(msg) + '</b>';
      baoLoi(err);
    }).locDanhSachHoSo(boLoc);
  }

  /** Chuẩn hoá trạng thái hồ sơ — hồ sơ cũ chưa có TrangThai coi như "Chờ tạo hồ sơ". */
  function chuanHoaTrangThaiHoSo_(t) {
    return t || 'Chờ tạo hồ sơ';
  }

  function lopTrangThaiHoSo_(t) {
    t = chuanHoaTrangThaiHoSo_(t);
    if (t === 'Đã giải ngân') return 'trangthai-daigiaingan';
    if (t === 'Đã tạo hồ sơ') return 'trangthai-daotaohoso';
    return 'trangthai-chotaohoso';
  }

  /** Cập nhật số đếm trên các pill lọc trạng thái (tính trên toàn bộ DS_HO_SO đang tải, chưa lọc trạng thái). */
  function capNhatDemTrangThaiHoSo_() {
    var dem = { 'Chờ tạo hồ sơ': 0, 'Đã tạo hồ sơ': 0, 'Đã giải ngân': 0 };
    DS_HO_SO.forEach(function (h) { dem[chuanHoaTrangThaiHoSo_(h.trangThai)]++; });
    var setTxt = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
    setTxt('pillDem-hoso-tatca', DS_HO_SO.length);
    setTxt('pillDem-hoso-chotao', dem['Chờ tạo hồ sơ']);
    setTxt('pillDem-hoso-datao', dem['Đã tạo hồ sơ']);
    setTxt('pillDem-hoso-dagiaingan', dem['Đã giải ngân']);
  }

  /** Bấm vào 1 pill trạng thái để lọc bảng danh sách hồ sơ (lọc phía client trên dữ liệu đã tải). */
  function locTheoTrangThaiHoSo_(trangThai) {
    TRANG_THAI_LOC_HOSO = trangThai || '';
    document.querySelectorAll('#hoSoListView .pill-tabs .pill').forEach(function (p) {
      p.classList.toggle('active', p.getAttribute('data-trangthai') === TRANG_THAI_LOC_HOSO);
    });
    renderBangHoSo_();
  }

  function renderBangHoSo_() {
    var tbody = document.getElementById('tbody_dsHoSo');
    if (!tbody) return;
    capNhatDemTrangThaiHoSo_();
    tbody.innerHTML = '';
    var ds = TRANG_THAI_LOC_HOSO
      ? DS_HO_SO.filter(function (h) { return chuanHoaTrangThaiHoSo_(h.trangThai) === TRANG_THAI_LOC_HOSO; })
      : DS_HO_SO;

    var bangWrap = document.getElementById('hoSoBangWrap');
    var rongEl = document.getElementById('hoSoEmptyState');
    if (!ds.length) {
      if (bangWrap) bangWrap.style.display = 'none';
      if (rongEl) {
        rongEl.style.display = 'block';
        var tieuDe = document.getElementById('hoSoEmptyTitle');
        var moTa = document.getElementById('hoSoEmptySub');
        if (DS_HO_SO.length) {
          if (tieuDe) tieuDe.textContent = TRANG_THAI_LOC_HOSO ? 'Không có hồ sơ nào ở trạng thái "' + TRANG_THAI_LOC_HOSO + '"' : 'Không có hồ sơ nào khớp bộ lọc';
          if (moTa) moTa.textContent = 'Thử đổi bộ lọc/trạng thái khác, hoặc bấm "Tất cả" để xem toàn bộ.';
        } else {
          if (tieuDe) tieuDe.textContent = 'Chưa có hồ sơ giải ngân nào';
          if (moTa) moTa.textContent = 'Tạo hồ sơ giải ngân mới để bắt đầu.';
        }
      }
      return;
    }
    if (bangWrap) bangWrap.style.display = 'block';
    if (rongEl) rongEl.style.display = 'none';

    ds.forEach(function (h) {
      var dangChon = h.maHoSo === MA_HO_SO_DANG_SUA;
      var tr = document.createElement('tr');
      if (dangChon) tr.style.background = '#EAF1F8';
      var coTheXoa = h.trangThai !== 'Đã giải ngân';
      var lopTrangThai = lopTrangThaiHoSo_(h.trangThai);
      tr.innerHTML =
        '<td><b>' + esc(h.maHoSo) + '</b></td>' +
        '<td>' + esc(h.tenCty) + '</td>' +
        '<td>' + esc(h.soHopDong) + '</td>' +
        '<td>' + esc(h.soGiayNhanNo) + '</td>' +
        '<td>' + esc(h.ngayGiaiNgan) + '</td>' +
        '<td style="text-align:right;">' + (Number(h.soTien) || 0).toLocaleString('vi-VN') + '</td>' +
        '<td><span class="trangthai-badge ' + lopTrangThai + '">' + esc(chuanHoaTrangThaiHoSo_(h.trangThai)) + '</span></td>' +
        '<td style="white-space:nowrap;">' +
          '<button type="button" class="btn btn-secondary" style="padding:4px 8px; font-size:11px; margin:0 4px 0 0;" onclick="suaHoSoTuBang(\'' + h.maHoSo + '\')">👁️ Xem/Sửa</button>' +
          (coTheXoa
            ? '<button type="button" class="btn btn-danger" onclick="xoaHoSoTuBang(\'' + h.maHoSo + '\')">🗑️ Xoá</button>'
            : '') +
        '</td>';
      tbody.appendChild(tr);
    });
  }

  // =========================================================================
  // ĐIỀU HƯỚNG: Khung Danh sách ⇄ Khung Form nhập theo bước (chỉ 1 khung hiện tại 1 lúc)
  // =========================================================================

  /** Hiện khung Danh sách, ẩn khung Form — dùng khi vào tab, sau khi Duyệt, hoặc bấm "Quay lại Danh Sách". */
  function moHoSoListView_() {
    var list = document.getElementById('hoSoListView');
    var form = document.getElementById('hoSoFormView');
    if (list) list.style.display = 'block';
    if (form) form.style.display = 'none';
    locDanhSachHoSoClick();
  }

  /** Hiện khung Form nhập theo bước, ẩn khung Danh sách — dùng khi bấm "+ Tạo Mới" hoặc "Xem/Sửa" 1 hồ sơ. */
  function moHoSoFormView_(tieuDe) {
    var list = document.getElementById('hoSoListView');
    var form = document.getElementById('hoSoFormView');
    if (list) list.style.display = 'none';
    if (form) form.style.display = 'block';
    var elTieuDe = document.getElementById('hoSoFormTieuDe');
    if (elTieuDe) elTieuDe.textContent = tieuDe || 'Tạo Hồ Sơ Giải Ngân';
    var wiz = document.getElementById('hoSoFormView');
    if (wiz) wiz.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /** Nút "‹ Quay lại Danh Sách" ở khung Form — cảnh báo nếu có dữ liệu chưa lưu. */
  function quayLaiDanhSachHoSo_() {
    if (FORM_DIRTY) {
      hoiXacNhan('Bạn đang có dữ liệu chưa lưu ở hồ sơ hiện tại. Quay lại Danh Sách sẽ mất dữ liệu chưa lưu này. Vẫn tiếp tục?', function () {
        moHoSoListView_();
      });
    } else {
      moHoSoListView_();
    }
  }

  function suaHoSoTuBang(maHoSo) {
    if (FORM_DIRTY) {
      hoiXacNhan('Bạn đang có dữ liệu chưa lưu ở hồ sơ hiện tại. Chuyển sang xem hồ sơ khác sẽ mất dữ liệu chưa lưu này. Vẫn tiếp tục?', function () {
        thucHienMoHoSoDeSua_(maHoSo);
      });
    } else {
      thucHienMoHoSoDeSua_(maHoSo);
    }
  }

  function thucHienMoHoSoDeSua_(maHoSo) {
    hienLoading(true);
    google.script.run.withSuccessHandler(function (data) {
      try {
        MA_HO_SO_DANG_SUA = maHoSo;
        dienDuLieuVaoForm(data);
        renderBangHoSo_();
        // Mở hồ sơ ĐÃ CÓ (không phải tạo mới) -> vào thẳng Bước 3 vì đó là nơi hiện văn bản/link đã
        // tạo trước đó (đặc biệt quan trọng với hồ sơ "Đã giải ngân" — chỉ xem lại, không cần đi
        // từng bước). Đặt boQuaKiemTra để không bị chặn bởi validate, đồng thời đánh dấu bước 1-2 là
        // "đã qua" (done) để vẫn bấm số bước lùi lại xem/sửa được bình thường.
        chuyenBuocHoSo_(3, { boQuaKiemTra: true });
        moHoSoFormView_('Xem / Sửa Hồ Sơ — ' + maHoSo);
        hienLoading(false);
      } catch (e) {
        hienLoading(false);
        baoLoi('Lỗi khi hiển thị hồ sơ ' + maHoSo + ': ' + e.message);
      }
    }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).layDuLieuDayDu(maHoSo);
  }

  function xoaHoSoTuBang(maHoSo) {
    hoiXacNhan('Xoá hồ sơ ' + maHoSo + '? Thao tác này không thể hoàn tác.', function () {
      hienLoading(true);
      google.script.run.withSuccessHandler(function () {
        hienLoading(false);
        baoThanhCong('Đã xoá hồ sơ ' + maHoSo + '.');
        if (MA_HO_SO_DANG_SUA === maHoSo) resetFormMoi();
        locDanhSachHoSoClick();
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).xoaHoSo(maHoSo);
    });
  }

  function onChonCongTyEdit() {
    var sel = document.getElementById('selCongTyEdit');
    if (!sel) return;
    var maCty = String(sel.value).trim();
    MA_CTY_DANG_SUA = maCty;
    var c = DS_CONG_TY.filter(function (x) { return String(x.MaCty).trim() === maCty; })[0];
    document.getElementById('ct_tenCty').value = c ? c.TenCty : '';
    document.getElementById('ct_maCIF').value = c ? c.MaCIF : '';
    document.getElementById('ct_diaChiTruSo').value = c ? c.DiaChiTruSo : '';
    document.getElementById('ct_dienThoai').value = c ? c.DienThoai : '';
    document.getElementById('ct_fax').value = c ? c.Fax : '';
    document.getElementById('ct_nguoiDaiDien').value = c ? c.NguoiDaiDien : '';
    document.getElementById('ct_chucVu').value = c ? c.ChucVu : '';
    document.getElementById('ct_giayUyQuyenSo').value = c ? c.GiayUyQuyenSo : '';
    document.getElementById('ct_giayUyQuyenNgay').value = c ? toInputDate(c.GiayUyQuyenNgay) : '';
    document.getElementById('ct_nguoiLapBieu').value = c ? (c.NguoiLapBieu || '') : '';
    var lbl = document.getElementById('congTyDangSuaLabel');
    if (lbl) lbl.textContent = c ? ('Xem / Sửa: ' + c.TenCty) : 'Thêm công ty mới';
    apDungKhoaModalCongTy_(c);
  }

  /** Khoá/mở khoá các trường trong modal Công ty tuỳ theo công ty có đang được hồ sơ giải ngân sử dụng hay không. */
  function apDungKhoaModalCongTy_(c) {
    var dangSuDung = !!(c && c.dangSuDung);
    document.querySelectorAll('#modalCongTy .grid input').forEach(function (el) { el.disabled = dangSuDung; });
    var btnLuu = document.getElementById('btnLuuCongTyModal');
    if (btnLuu) btnLuu.style.display = dangSuDung ? 'none' : 'inline-flex';
    var btnXoa = document.getElementById('btnXoaCongTyModal');
    if (btnXoa) btnXoa.style.display = (c && !dangSuDung) ? 'inline-flex' : 'none';
    var canhBao = document.getElementById('canhBaoKhoaCongTy');
    if (canhBao) {
      canhBao.style.display = dangSuDung ? 'block' : 'none';
      canhBao.innerHTML = dangSuDung
        ? '🔒 Công ty này đã có hồ sơ giải ngân gắn với hợp đồng của công ty — chỉ có thể xem, không thể sửa/xoá.' +
          ' <a onclick="toggleXemHoSoDangGan_(\'congty\', \'' + esc(c.MaCty) + '\')" style="cursor:pointer; font-weight:700; text-decoration:underline;">Xem chi tiết hồ sơ đang gắn ▾</a>' +
          '<div id="dsHoSoDangGan_congty" style="display:none; margin-top:8px;"></div>'
        : '';
    }
  }

  var HOSO_DANG_GAN_CACHE_ = {};

  /** Bấm "Xem chi tiết hồ sơ đang gắn" trong banner khoá — tải (có cache) và hiện/ẩn danh sách hồ sơ. */
  function toggleXemHoSoDangGan_(loai, ma) {
    var el = document.getElementById('dsHoSoDangGan_' + loai);
    if (!el) return;
    if (el.style.display === 'block') { el.style.display = 'none'; return; }
    el.style.display = 'block';
    var cacheKey = loai + ':' + ma;
    if (HOSO_DANG_GAN_CACHE_[cacheKey]) {
      el.innerHTML = renderDsHoSoDangGan_(HOSO_DANG_GAN_CACHE_[cacheKey]);
      return;
    }
    el.innerHTML = '<span class="hint">Đang tải...</span>';
    var tenHam = (loai === 'congty') ? 'layDanhSachHoSoTheoCongTy' : 'layDanhSachHoSoTheoHopDong';
    google.script.run.withSuccessHandler(function (ds) {
      HOSO_DANG_GAN_CACHE_[cacheKey] = ds;
      el.innerHTML = renderDsHoSoDangGan_(ds);
    }).withFailureHandler(function (err) {
      el.innerHTML = '<span class="hint">Không tải được danh sách hồ sơ (' + esc(err.message || err) + ').</span>';
    })[tenHam](ma);
  }

  function renderDsHoSoDangGan_(ds) {
    if (!ds || !ds.length) return '<span class="hint">Không tìm thấy hồ sơ nào (dữ liệu có thể vừa thay đổi).</span>';
    var coCotHD = ds[0] && ds[0].soHopDong !== undefined;
    var rows = ds.map(function (h) {
      return '<tr onclick="moHoSoTuDanhMuc_(\'' + esc(h.maHoSo) + '\')" style="cursor:pointer;">' +
        '<td><b>' + esc(h.maHoSo) + '</b></td>' +
        (coCotHD ? '<td>' + esc(h.soHopDong) + '</td>' : '') +
        '<td>' + esc(h.soGiayNhanNo) + '</td>' +
        '<td>' + esc(h.ngayGiaiNgan) + '</td>' +
        '<td><span class="trangthai-badge ' + lopTrangThaiHoSo_(h.trangThai) + '">' + esc(chuanHoaTrangThaiHoSo_(h.trangThai)) + '</span></td>' +
        '</tr>';
    }).join('');
    return '<div class="hint" style="margin-bottom:4px;">Bấm vào 1 dòng để mở hồ sơ đó:</div>' +
      '<table class="detail" style="font-size:12px;"><thead><tr><th>Mã hồ sơ</th>' +
      (coCotHD ? '<th>Hợp đồng</th>' : '') +
      '<th>Số GNN</th><th>Ngày giải ngân</th><th>Trạng thái</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function renderDanhSachKH_(tuKhoa) {
    var dd = document.getElementById('ddKhachHang');
    if (!KH_DROPDOWN_INPUT || !dd) return;
    var tk = tuKhoa.trim().toUpperCase();
    var ds = DS_KHACH_HANG.filter(function (k) {
      if (!tk) return true;
      return String(k.TenKhachHang || '').toUpperCase().indexOf(tk) >= 0;
    });

    if (!ds.length) {
      dd.innerHTML = '<div class="kh-empty">Không có khách hàng khớp — vẫn có thể tự gõ tên mới.</div>';
    } else {
      dd.innerHTML = '';
      ds.forEach(function (k) {
        var item = document.createElement('div');
        item.className = 'kh-item';
        item.textContent = k.TenKhachHang + (k.MaSoThue ? ' — MST ' + k.MaSoThue : '');
        item.onmousedown = function (e) {
          e.preventDefault();
          chonKHTuDropdown_(k);
        };
        dd.appendChild(item);
      });
    }

    var rect = KH_DROPDOWN_INPUT.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.bottom + 2) + 'px';
    dd.style.width = Math.max(rect.width, 220) + 'px';
    dd.style.display = 'block';
  }

  function chonKHTuDropdown_(k) {
    if (!KH_DROPDOWN_INPUT) return;
    KH_DROPDOWN_INPUT.value = k.TenKhachHang;
    var tr = KH_DROPDOWN_INPUT.closest('tr');
    if (tr) {
      tr.querySelector('.ct-stk').value = k.SoTaiKhoan || '';

  function onChonCongTy(callback) {
    var selCongTy = document.getElementById('selCongTy');
    if (!selCongTy) return;
    var maCty = String(selCongTy.value).trim(); // Bắt triệt để khoảng trắng
    var selHD = document.getElementById('selHopDong');
    if (selHD) { selHD.options.length = 0; selHD.add(new Option("-- Chọn hợp đồng --", "")); }
    
    var elHD = document.getElementById('thongBaoSoHopDong');
    if (elHD) elHD.textContent = '';
    
    var cty = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === maCty; })[0];
    document.getElementById('nguoiLapBieu').value = cty ? (cty.NguoiLapBieu || '') : '';
    
    // Nếu dropdown trống (lúc load trang), thoát luôn
    if (!maCty) { if (callback) callback(); return; }
    
    google.script.run.withSuccessHandler(function (list) {
      DS_HOP_DONG = list || [];
      DS_HOP_DONG.forEach(function (h) {
        var label = h.SoHopDong + ' - ' + (h.TenNganHang || '') + ' ' + (h.ChiNhanh || '');
        if (selHD) selHD.add(new Option(label, h.MaHD));
      });
      if (elHD) elHD.textContent = '(mã công ty đang chọn: ' + maCty + ' — máy chủ trả về ' + DS_HOP_DONG.length + ' hợp đồng khớp)';
      if (callback) callback();
    }).withFailureHandler(function (err) {
      if (elHD) elHD.innerHTML = '<b style="color:#b71c1c;">LỖI: ' + esc((err && err.message) || String(err)) + '</b>';
      baoLoi(err);
      if (callback) callback();
    }).layDanhSachHopDong(maCty);
  }

  function dienDuLieuVaoForm(data) {
    var hoSo = data.hoSo, hopDong = data.hopDong, congTy = data.congTy, chiTiet = data.chiTiet;
    document.getElementById('selCongTy').value = congTy.MaCty;
    onChonCongTy(function () {

    });

    document.getElementById('soGiayNhanNo').value = hoSo.SoGiayNhanNo || '';

    document.getElementById('duNoHienTai').value = (Number(hoSo.DuNoHienTai) || 0).toLocaleString('vi-VN');
    document.getElementById('soTienNhanNoLanNay').value = (Number(hoSo.SoTienNhanNoLanNay) || 0).toLocaleString('vi-VN');
    document.getElementById('phuongThucThanhToan').value = hoSo.PhuongThucThanhToan || 'Chuyển khoản';
    document.getElementById('ngayGiaiNgan').value = toInputDate(hoSo.NgayGiaiNgan);
    document.getElementById('thoiHanChoVayNgay').value = hoSo.ThoiHanChoVay_Ngay || '';
    tinhNgayDenHan();
    document.getElementById('soThamChieu').value = hoSo.SoThamChieu || '';
    document.getElementById('mucDichSuDungVon').value = hoSo.MucDichSuDungVon || '';
    document.getElementById('nguoiLapBieu').value = hoSo.NguoiLapBieu || '';
    document.getElementById('taiLieuChungMinhMucDich').value = hoSo.TaiLieuChungMinhMucDich || '';

    TRANG_THAI_HIEN_TAI = hoSo.TrangThai || 'Đã tạo hồ sơ';
    capNhatTrangThaiHienThi_();

    document.getElementById('tbodyChiTiet').innerHTML = '';
    DEM_DONG = 0;
    if (chiTiet && chiTiet.length) {
      chiTiet.forEach(function (ct) { themDong(ct); });
    } else {
      themDong(); themDong(); themDong();
    }
    capNhatTongTien();
    apDungKhoaFormTheoTrangThai();
    hienLaiLinkDaTao_(hoSo);
    FORM_DIRTY = false;
  }

  function hienLaiLinkDaTao_(hoSo) {
    var box = document.getElementById('linksBox');
    box.innerHTML = '';
    var danhSach = [
      ['Giấy nhận nợ', hoSo.Link_GiayNhanNo, hoSo.Link_GiayNhanNo_PDF],
      ['Văn bản đề nghị giải ngân', hoSo.Link_VanBanDeNghi, hoSo.Link_VanBanDeNghi_PDF],
      ['Uỷ nhiệm chi 4 liên', hoSo.Link_UNC, hoSo.Link_UNC_PDF],
      ['Bảng kê tài liệu chứng minh MĐSDV', hoSo.Link_BangKeTaiLieu, hoSo.Link_BangKeTaiLieu_PDF],
      ['Phụ lục 02 - Bảng kê UNC', hoSo.Link_BangKeUNC, hoSo.Link_BangKeUNC_PDF]
    ];
    var coVanBan = danhSach.some(function (d) { return d[1] || d[2]; });
    if (!coVanBan) {
      // Không có văn bản nào -> báo rõ lý do thay vì để trống trơn (dễ tưởng nhầm là lỗi hiển thị),
      // nhất là khi hồ sơ đã "Đã giải ngân" (khoá) — người dùng cần biết vì sao không thấy văn bản.
      var daKhoa = (hoSo.TrangThai === 'Đã giải ngân');
      var canhBao = document.createElement('div');
      canhBao.className = 'hint';
      canhBao.style.marginTop = '6px';
      canhBao.textContent = daKhoa
        ? '⚠️ Hồ sơ này đã "Đã giải ngân" nhưng CHƯA từng bấm "Tạo trọn bộ theo MẪU THẬT" nên chưa có văn bản nào được tạo. Vì hồ sơ đã khoá nên không thể tạo lại — cần liên hệ người quản trị nếu thực sự cần tạo văn bản cho hồ sơ này.'
        : 'Chưa tạo văn bản nào cho hồ sơ này — bấm "📋 Tạo trọn bộ theo MẪU THẬT" ở trên để tạo.';
      box.appendChild(canhBao);
      return;
    }
    var tieuDe = document.createElement('div');
    tieuDe.className = 'hint';
    tieuDe.style.marginBottom = '4px';
    tieuDe.textContent = '📁 Văn bản đã tạo trước đó (bấm để xem/in lại):';
    box.appendChild(tieuDe);
    danhSach.forEach(function (d) {
      hienLinkCap_(d[0], { docUrl: d[1], sheetUrl: d[1], pdfUrl: d[2] });
    });
  }

  function apDungKhoaFormTheoTrangThai() {
    var daGiaiNgan = TRANG_THAI_HIEN_TAI === 'Đã giải ngân';
    var vungKhoa = document.querySelectorAll(
      '#hoSoBuoc1 input, #hoSoBuoc1 select,' +
      '#hoSoBuoc2 input, #hoSoBuoc2 select,' +
      '#tbodyChiTiet input, #tbodyChiTiet select, #tbodyChiTiet button'
    );
    vungKhoa.forEach(function (el) {
      if (el.hasAttribute('readonly') && (el.id === 'ngayDenHan' || el.id === 'soTienNhanNoLanNay')) return;
      el.disabled = daGiaiNgan;
    });

    document.querySelectorAll(
      '#hoSoBuoc3 .toolbar button, #hoSoBuoc3 .wizard-actions button'
    ).forEach(function (btn) { btn.disabled = daGiaiNgan; });

    var banner = document.getElementById('bannerKhoa');

  function layGiaTriSo_(v) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[^0-9\-]/g, '');
    var n = parseInt(s, 10);

  /** "22/07/2026" -> "2026-07-22" (cho input type=date). Không parse được thì trả về ''. */
  function dateVNSangISO_(s) {
    if (!s) return '';
    s = String(s).trim();
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    return '';
  }

  /** "2026-07-22" -> "22/07/2026" (khi lưu từ input type=date). Không đúng định dạng ISO thì giữ nguyên. */
  function isoSangDateVN_(s) {
    if (!s) return '';
    var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return s;
    return m[3] + '/' + m[2] + '/' + m[1];
  }

  /** Nút 🔀 cạnh ô "Ngày tài liệu" — chuyển đổi thủ công giữa lịch chọn ngày (1 ngày) và gõ tay
   *  (cho phép nhiều ngày, cách nhau bởi dấu phẩy) khi không dùng nút 🔎 chọn tài liệu tự động. */
  function toggleKieuNgayTaiLieu_(btn) {
    var input = btn.parentElement.querySelector('.ct-ngaytl');
    if (!input) return;
    if (input.type === 'date') {
      var v = input.value ? isoSangDateVN_(input.value) : '';
      input.type = 'text';
      input.value = v;
      input.placeholder = 'VD: 22/07/2026, 25/07/2026';
      input.focus();
    } else {
      var vRaw = input.value.trim();
      if (vRaw.indexOf(',') >= 0) {
        baoLoi('Đang có nhiều ngày (cách nhau dấu phẩy) — không thể chuyển sang lịch chọn ngày. Hãy để lại đúng 1 ngày rồi thử lại.');
        return;
      }
      var iso = dateVNSangISO_(vRaw);
      if (vRaw && !iso) {
        baoLoi('Ngày "' + vRaw + '" không đúng định dạng dd/MM/yyyy — không thể chuyển sang lịch chọn ngày.');
        return;
      }
      input.type = 'date';
      input.value = iso;
    }
  }

  function timTrungThuHuong_(chiTiet) {
    var dem = {}, trung = {};
    chiTiet.forEach(function (ct) {
      var key = String(ct.tenNguoiHuong || '').trim().toUpperCase() + '|' + String(ct.soTaiKhoan || '').trim();
      if (key === '|') return;
      dem[key] = (dem[key] || 0) + 1;
      if (dem[key] > 1) trung[ct.tenNguoiHuong] = true;
    });
    return Object.keys(trung);
  }

  // Hàm hỗ trợ: Loại bỏ dấu tiếng Việt để tìm kiếm chính xác tuyệt đối
function xoaDauVN(str) {
  if (!str) return '';
  return String(str)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .toLowerCase()
    .trim();
}

function locSelectTheoTuKhoa_(inputEl, selectId) {
  var tuKhoa = xoaDauVN(inputEl.value);
  var sel = document.getElementById(selectId);
  if (!sel) return;

  var nguon, placeholder, layNhan, maCotKhoa;
  if (selectId === 'selCongTyEdit') {
    nguon = DS_CONG_TY;
    placeholder = '-- Tạo công ty mới --';
    maCotKhoa = 'MaCty';
    layNhan = function (c) { return c.TenCty; };
  } else if (selectId === 'selHopDongEdit') {
    nguon = DS_HOP_DONG_ALL;
    placeholder = '-- Tạo hợp đồng mới --';
    maCotKhoa = 'MaHD';
    layNhan = function (h) {
      var congTy = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === String(h.MaCty).trim(); })[0];
      var ten = congTy ? congTy.TenCty : h.MaCty;
      return h.SoHopDong + ' - ' + ten;
    };
  } else {
    return;
  }

  var giaTriHienTai = sel.value;
  sel.options.length = 0;
  sel.add(new Option(placeholder, ""));
  
  (nguon || []).forEach(function (item) {
    var nhan = layNhan(item);
    // So sánh chuỗi đã được loại bỏ dấu
    if (tuKhoa && xoaDauVN(nhan).indexOf(tuKhoa) < 0) return;
    sel.add(new Option(nhan, item[maCotKhoa]));
  });

  // Giữ lại lựa chọn hiện tại nếu vẫn còn khớp bộ lọc
  var conKhop = Array.prototype.some.call(sel.options, function (opt) { return opt.value === giaTriHienTai; });
  sel.value = conKhop ? giaTriHienTai : '';
}

  // =========================================================================

  function kiemTraKetNoiClick() {
    var payload = layPayloadCauHinh_();
    var coGiTraKhong = Object.keys(payload).some(function (k) { return payload[k]; });
    var el = document.getElementById('ketQuaKiemTraKetNoi');
    if (!coGiTraKhong) {
      if (el) el.innerHTML = '<span class="hint">Chưa nhập link/ID nào để kiểm tra — các ô trống sẽ tự dùng lại cấu hình mặc định/đã lưu, không cần kiểm tra.</span>';
      return;
    }
    if (el) el.innerHTML = '<span class="hint">Đang kiểm tra kết nối...</span>';
    hienLoading(true);
    google.script.run.withSuccessHandler(function (ds) {
      hienLoading(false);
      if (!ds.length) { if (el) el.innerHTML = ''; return; }
      var soLoi = ds.filter(function (r) { return !r.ok; }).length;
      var html = '<table class="detail" style="font-size:12.5px;"><thead><tr><th>Mục</th><th>Kết quả</th></tr></thead><tbody>';
      ds.forEach(function (r) {
        html += '<tr><td>' + esc(r.ten) + '</td><td>' +
          (r.ok ? '<span style="color:#0F5C38; font-weight:700;">✅ ' + esc(r.thongBao) + '</span>'
                : '<span style="color:#8E241A; font-weight:700;">❌ ' + esc(r.thongBao) + '</span>') +
          '</td></tr>';
      });
      html += '</tbody></table>';
      if (el) el.innerHTML = html;
      if (soLoi) baoLoi(soLoi + ' mục kiểm tra không truy cập được — xem chi tiết bên dưới trước khi lưu.');
      else baoThanhCong('Tất cả link/ID đã kiểm tra đều truy cập được. Có thể bấm "Lưu cấu hình".');
    }).withFailureHandler(function (err) {
      hienLoading(false);
      if (el) el.innerHTML = '';
      baoLoi(err);
    }).kiemTraCauHinh(payload);
  }

function taoBangKeUNCTheoMau(maHoSo) {
  var data = layDuLieuDayDu(maHoSo);
  var hoSo = data.hoSo, chiTiet = data.chiTiet || [];

  var folder = layThuMucXuatTheoMau_(maHoSo);
  var tenFile = tenFileTheoMau_('BangKe_UNC_4lien', maHoSo);
  var copy = DriveApp.getFileById(TEMPLATE_BANGKE_UNC_4LIEN_ID).makeCopy(tenFile, folder);
  var ss = SpreadsheetApp.openById(copy.getId());
  var sh = ss.getSheets()[0];

  sh.getRange('A2').setValue('Số tham chiếu LTT: ' + (hoSo.SoThamChieu || ''));

  var dongDauDuLieu = 7, soDongMau = 2;
  var soDongCanCo = Math.max(chiTiet.length, 1);
  var chenhLech = dieuChinhSoDongBang_(sh, dongDauDuLieu, soDongMau, soDongCanCo);

  var rows = [];
  var tong = 0;
  chiTiet.forEach(function (ct, i) {
    var tien = Number(ct.SoTien) || 0;
    tong += tien;
    rows.push([i + 1, ct.SoTaiKhoan || '', 'VND', ct.TenNguoiHuong || '', tien, ct.NoiDungThanhToan || '',
      ct.ChuyenTienNhanh_24_7 === 'Y' ? 'Y' : 'N', ct.TaiNganHang || '', ct.NgayCapGiayToTuyThan || '', ct.GhiChu || '']);
  });
  if (!rows.length) rows.push(['', '', 'VND', '', 0, '', 'N', '', '', '']);
  var vungDuLieu = sh.getRange(dongDauDuLieu, 1, rows.length, 10);
  vungDuLieu.setValues(rows);

  var dongTongCong = dongDauDuLieu + soDongCanCo;
  sh.getRange(dongTongCong, 1).setValue('Tổng cộng');
  sh.getRange(dongTongCong, 5).setValue(tong);

  var dongNguoiLap = 18 + chenhLech;
  sh.getRange('B' + dongNguoiLap).setValue(hoSo.NguoiLapBieu || '');

  // ===== Kẻ khung + canh lề + cỡ chữ cho toàn bộ vùng dữ liệu (kể cả dòng tổng) =====
  var vungKeKhung = sh.getRange(dongDauDuLieu, 1, soDongCanCo + 1, 10); // +1 để gồm cả dòng "Tổng cộng"
  vungKeKhung.setBorder(true, true, true, true, true, true);
  vungKeKhung.setFontSize(10);
  sh.getRange(dongDauDuLieu, 1, soDongCanCo, 1).setHorizontalAlignment('center'); // cột STT
  sh.getRange(dongDauDuLieu, 5, soDongCanCo, 1).setHorizontalAlignment('right');  // cột Số tiền
  sh.getRange(dongTongCong, 1, 1, 10).setFontWeight('bold');

  SpreadsheetApp.flush();
  var pdfUrl = xuatPdfTheoMauSheet_(copy.getId(), sh.getSheetId(), tenFile, folder,
    { hangCuoi: dongTongCong + 2, cotCuoi: 10 });
  return { sheetUrl: copy.getUrl(), pdfUrl: pdfUrl, ten: tenFile };
};
