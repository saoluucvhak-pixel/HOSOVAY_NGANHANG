<script>
  var DS_CONG_TY = [];
  var DS_HOP_DONG = [];
  var DS_HOP_DONG_ALL = [];
  var DS_HO_SO = [];
  var DS_KHACH_HANG = [];
  var MA_HO_SO_DANG_SUA = '';
  var MA_CTY_DANG_SUA = '';
  var MA_HD_DANG_SUA = '';
  var MA_KH_DANG_SUA = '';
  var TRANG_THAI_HIEN_TAI = '';
  var NGAY_HOM_NAY_SERVER = '';
  var DEM_DONG = 0;
  var FORM_DIRTY = false;

  window.onerror = function (msg, url, line, col, err) {
    var box = document.getElementById('msgBox');
    if (box) {
      box.innerHTML = '<div class="msg msg-err"><b>⚠️ Lỗi JavaScript:</b> ' + esc(String(msg)) +
        ' (dòng ' + line + ')<br><span class="hint">Chụp lại dòng này gửi cho lập trình viên để sửa.</span></div>';
    }
    console.error("Lỗi JS: ", msg, err);
    return false;
  };

  document.addEventListener('DOMContentLoaded', function () {
    taiDuLieuBanDau();
    var vungTheoDoi = document.getElementById('tab-hoso');
    if (vungTheoDoi) {
      vungTheoDoi.addEventListener('input', function () { FORM_DIRTY = true; });
      vungTheoDoi.addEventListener('change', function () { FORM_DIRTY = true; });
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (FORM_DIRTY) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('ct-ten')) return;
    var dd = document.getElementById('ddKhachHang');
    if (dd && !dd.contains(e.target)) dd.style.display = 'none';
  });

  var DA_KHOI_TAO_BAOCAO = false;

  var TIEU_DE_TAB = {
    hoso: 'Hồ sơ giải ngân',
    congty: 'Danh mục công ty',
    hopdong: 'Danh mục hợp đồng vay',
    khachhang: 'Danh mục khách hàng',
    baocao: 'Báo cáo tiền vay'
  };

  function chuyenTab(ten) {
    ['hoso', 'congty', 'hopdong', 'khachhang', 'baocao'].forEach(function (t) {
      var el = document.getElementById('tab-' + t);
      if (el) el.style.display = (t === ten) ? 'block' : 'none';
      var btn = document.getElementById('tabBtn-' + t);
      if (btn) btn.classList.toggle('active', t === ten);
    });
    var elTieuDe = document.getElementById('pageTitle');
    if (elTieuDe) elTieuDe.textContent = TIEU_DE_TAB[ten] || '';
    if (ten === 'baocao' && !DA_KHOI_TAO_BAOCAO) {
      DA_KHOI_TAO_BAOCAO = true;
      var homNay = NGAY_HOM_NAY_SERVER || toInputDate(new Date());
      document.getElementById('bc_tuNgay').value = '';
      document.getElementById('bc_denNgay').value = homNay;
      locBaoCaoTienVay();
    }
  }

  function capNhatBadgeSidebar_() {
    var b;
    b = document.getElementById('badge-hoso'); if (b) b.textContent = DS_HO_SO.length;
    b = document.getElementById('badge-congty'); if (b) b.textContent = DS_CONG_TY.length;
    b = document.getElementById('badge-hopdong'); if (b) b.textContent = DS_HOP_DONG_ALL.length;
    b = document.getElementById('badge-khachhang'); if (b) b.textContent = DS_KHACH_HANG.length;
  }

  function napDropdownCongTy_(selectId, placeholder) {
    var sel = document.getElementById(selectId);
    if (!sel) return;
    sel.options.length = 0;
    sel.add(new Option(placeholder, ""));
    DS_CONG_TY.forEach(function (c) {
      sel.add(new Option(c.TenCty, c.MaCty));
    });
  }

  function napDanhMucCoBan(callback) {
    google.script.run.withSuccessHandler(function (list) {
      DS_CONG_TY = list || [];
      napDropdownCongTy_('selCongTy', '-- Chọn công ty --');
      napDropdownCongTy_('selCongTyEdit', '-- Tạo công ty mới --');
      napDropdownCongTy_('hd_maCty', '-- Chọn công ty --');
      napDropdownCongTy_('loc_congTy', '-- Tất cả --');
      
      var elCT = document.getElementById('thongBaoSoCongTy');
      if (elCT) elCT.textContent = '(máy chủ trả về ' + DS_CONG_TY.length + ' công ty)';

      var selGoiY = document.getElementById('selNguoiLapBieuGoiY');
      if (selGoiY) {
        selGoiY.options.length = 0;
        selGoiY.add(new Option("▾", ""));
        var daThay = {};
        DS_CONG_TY.forEach(function (c) {
          var ten = (c.NguoiLapBieu || '').trim();
          if (!ten || daThay[ten]) return;
          daThay[ten] = true;
          selGoiY.add(new Option(ten, ten));
        });
      }

      google.script.run.withSuccessHandler(function (list2) {
        DS_HOP_DONG_ALL = list2 || [];
        var sel = document.getElementById('selHopDongEdit');
        var selLoc = document.getElementById('loc_hopDong');
        if (sel) { sel.options.length = 0; sel.add(new Option("-- Tạo hợp đồng mới --", "")); }
        if (selLoc) { selLoc.options.length = 0; selLoc.add(new Option("-- Tất cả --", "")); }
        
        DS_HOP_DONG_ALL.forEach(function (h) {
          // Lọc cực kỳ an toàn, triệt tiêu mọi khoảng trắng
          var congTy = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === String(h.MaCty).trim(); })[0];
          var ten = congTy ? congTy.TenCty : h.MaCty;
          var label = h.SoHopDong + ' - ' + ten;
          if (sel) sel.add(new Option(label, h.MaHD));
          if (selLoc) selLoc.add(new Option(label, h.MaHD));
        });

        google.script.run.withSuccessHandler(function (list3) {
          DS_KHACH_HANG = list3 || [];
          var selKH = document.getElementById('selKhachHangEdit');
          var dl = document.getElementById('dsKhachHang');
          if (selKH) { selKH.options.length = 0; selKH.add(new Option("-- Tạo khách hàng mới --", "")); }
          if (dl) dl.innerHTML = '';
          
          DS_KHACH_HANG.forEach(function (k) {
            if (selKH) selKH.add(new Option(k.TenKhachHang + (k.MaSoThue ? ' - MST ' + k.MaSoThue : ''), k.MaKH));
            if (dl) {
              var opt = document.createElement('option');
              opt.value = k.TenKhachHang;
              dl.appendChild(opt);
            }
          });
          
          capNhatBadgeSidebar_();
          if (callback) callback();
        }).withFailureHandler(function (err) { if (callback) callback(); baoLoi(err); }).layDanhSachKhachHang();
      }).withFailureHandler(function (err) { baoLoi(err); }).layDanhSachHopDong();
    }).withFailureHandler(function (err) {
      var elCT = document.getElementById('thongBaoSoCongTy');
      if (elCT) elCT.innerHTML = '<b style="color:#b71c1c;">LỖI: ' + esc((err && err.message) || String(err)) + '</b>';
      baoLoi(err);
    }).layDanhSachCongTy();
  }

  function taiDuLieuBanDau() {
    hienLoading(true);
    google.script.run.withSuccessHandler(function (ngay) {
      NGAY_HOM_NAY_SERVER = ngay || '';
      khoiTaoSauKhiCoNgay_();
    }).withFailureHandler(function () {
      NGAY_HOM_NAY_SERVER = '';
      khoiTaoSauKhiCoNgay_();
    }).layNgayHomNay();
  }

  function khoiTaoSauKhiCoNgay_() {
    napDanhMucCoBan(function () { onChonCongTy(); });
    datNgayLocMacDinh();
    locDanhSachHoSoClick();
    resetFormMoi();
    hienLoading(false);
  }

  function datNgayLocMacDinh() {
    var homNay = NGAY_HOM_NAY_SERVER || toInputDate(new Date());
    var d = new Date(homNay + 'T00:00:00');
    var dauThang = new Date(d.getFullYear(), d.getMonth(), 1);
    var elTu = document.getElementById('loc_tuNgay');
    var elDen = document.getElementById('loc_denNgay');
    if (elTu) elTu.value = toInputDate(dauThang);
    if (elDen) elDen.value = homNay;
  }

  function datNgayMacDinh() {
    var homNay = NGAY_HOM_NAY_SERVER || toInputDate(new Date());
    document.getElementById('ngayGiayNhanNo').value = homNay;
    document.getElementById('ngayGiaiNgan').value = homNay;
    tinhNgayDenHan();
  }

  function resetFormMoi() {
    MA_HO_SO_DANG_SUA = '';
    TRANG_THAI_HIEN_TAI = '';
    var selCty = document.getElementById('selCongTy');
    if (selCty) {
      selCty.value = '';
      onChonCongTy();
    }
    document.getElementById('soGiayNhanNo').value = '';
    datNgayMacDinh();
    document.getElementById('duNoHienTai').value = '0';
    document.getElementById('soTienNhanNoLanNay').value = '0';
    document.getElementById('phuongThucThanhToan').value = 'Chuyển khoản';
    document.getElementById('thoiHanChoVayNgay').value = '';
    document.getElementById('soThamChieu').value = '';
    document.getElementById('mucDichSuDungVon').value = '';
    document.getElementById('nguoiLapBieu').value = '';
    document.getElementById('taiLieuChungMinhMucDich').value = '';
    document.getElementById('linksBox').innerHTML = '';

    document.getElementById('tbodyChiTiet').innerHTML = '';
    DEM_DONG = 0;
    themDong(); themDong(); themDong();
    capNhatTongTien();
    capNhatTrangThaiHienThi_();
    apDungKhoaFormTheoTrangThai();
    FORM_DIRTY = false;
  }

  function themMoiHoSoClick() {
    resetFormMoi();
    baoThanhCong('Đã mở form trống — điền thông tin và bấm "Lưu hồ sơ" ở mục 5 để tạo hồ sơ mới.');
  }

  function locDanhSachHoSoClick() {
    var boLoc = {
      maHoSo: document.getElementById('loc_maHoSo').value.trim(),
      tuNgay: document.getElementById('loc_tuNgay').value,
      denNgay: document.getElementById('loc_denNgay').value,
      tenNguoiHuong: document.getElementById('loc_tenNguoiHuong').value.trim(),
      maCty: document.getElementById('loc_congTy').value,
      maHD: document.getElementById('loc_hopDong').value
    };
    var thongBao = document.getElementById('thongBaoSoHoSo');
    if (thongBao) thongBao.textContent = 'Đang tải...';
    google.script.run.withSuccessHandler(function (list) {
      DS_HO_SO = list || [];
      renderBangHoSo_();
      capNhatBadgeSidebar_();
      if (thongBao) thongBao.textContent = '(tìm thấy ' + DS_HO_SO.length + ' hồ sơ)';
    }).withFailureHandler(function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      if (thongBao) thongBao.innerHTML = '<b style="color:#b71c1c;">LỖI: ' + esc(msg) + '</b>';
      baoLoi(err);
    }).locDanhSachHoSo(boLoc);
  }

  function renderBangHoSo_() {
    var tbody = document.getElementById('tbody_dsHoSo');
    if (!tbody) return;
    tbody.innerHTML = '';
    if (!DS_HO_SO.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888; font-style:italic;">Không có hồ sơ nào khớp bộ lọc.</td></tr>';
      return;
    }
    DS_HO_SO.forEach(function (h) {
      var dangChon = h.maHoSo === MA_HO_SO_DANG_SUA;
      var tr = document.createElement('tr');
      if (dangChon) tr.style.background = '#EAF1F8';
      var coTheXoa = h.trangThai !== 'Đã giải ngân';
      var lopTrangThai = h.trangThai === 'Đã giải ngân' ? 'trangthai-daigiaingan' : 'trangthai-daotaohoso';
      tr.innerHTML =
        '<td><b>' + esc(h.maHoSo) + '</b></td>' +
        '<td>' + esc(h.tenCty) + '</td>' +
        '<td>' + esc(h.soHopDong) + '</td>' +
        '<td>' + esc(h.soGiayNhanNo) + '</td>' +
        '<td>' + esc(h.ngayGiaiNgan) + '</td>' +
        '<td style="text-align:right;">' + (Number(h.soTien) || 0).toLocaleString('vi-VN') + '</td>' +
        '<td><span class="trangthai-badge ' + lopTrangThai + '">' + esc(h.trangThai) + '</span></td>' +
        '<td style="white-space:nowrap;">' +
          '<button type="button" class="btn btn-secondary" style="padding:4px 8px; font-size:11px; margin:0 4px 0 0;" onclick="suaHoSoTuBang(\'' + h.maHoSo + '\')">✏️ Xem/Sửa</button>' +
          (coTheXoa
            ? '<button type="button" class="btn btn-danger" onclick="xoaHoSoTuBang(\'' + h.maHoSo + '\')">🗑️ Xoá</button>'
            : '') +
        '</td>';
      tbody.appendChild(tr);
    });
  }

  function suaHoSoTuBang(maHoSo) {
    if (FORM_DIRTY) {
      hoiXacNhan('Bạn đang có dữ liệu chưa lưu ở hồ sơ hiện tại. Chuyển sang xem hồ sơ khác sẽ mất dữ liệu chưa lưu này. Vẫn tiếp tục?', function () {
        thucHienMoHoSoDeSua_(maHoSo);
      });
    } else {
      thucHienMoHoSoDeSua_(maHoSo);
    }
  }

  function thucHienMoHoSoDeSua_(maHoSo) {
    hienLoading(true);
    google.script.run.withSuccessHandler(function (data) {
      try {
        MA_HO_SO_DANG_SUA = maHoSo;
        dienDuLieuVaoForm(data);
        renderBangHoSo_();
        hienLoading(false);
      } catch (e) {
        hienLoading(false);
        baoLoi('Lỗi khi hiển thị hồ sơ ' + maHoSo + ': ' + e.message);
      }
    }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).layDuLieuDayDu(maHoSo);
  }

  function xoaHoSoTuBang(maHoSo) {
    hoiXacNhan('Xoá hồ sơ ' + maHoSo + '? Thao tác này không thể hoàn tác.', function () {
      hienLoading(true);
      google.script.run.withSuccessHandler(function () {
        hienLoading(false);
        baoThanhCong('Đã xoá hồ sơ ' + maHoSo + '.');
        if (MA_HO_SO_DANG_SUA === maHoSo) resetFormMoi();
        locDanhSachHoSoClick();
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).xoaHoSo(maHoSo);
    });
  }

  function onChonCongTyEdit() {
    var sel = document.getElementById('selCongTyEdit');
    if (!sel) return;
    var maCty = String(sel.value).trim();
    MA_CTY_DANG_SUA = maCty;
    var c = DS_CONG_TY.filter(function (x) { return String(x.MaCty).trim() === maCty; })[0];
    document.getElementById('ct_tenCty').value = c ? c.TenCty : '';
    document.getElementById('ct_maCIF').value = c ? c.MaCIF : '';
    document.getElementById('ct_diaChiTruSo').value = c ? c.DiaChiTruSo : '';
    document.getElementById('ct_dienThoai').value = c ? c.DienThoai : '';
    document.getElementById('ct_fax').value = c ? c.Fax : '';
    document.getElementById('ct_nguoiDaiDien').value = c ? c.NguoiDaiDien : '';
    document.getElementById('ct_chucVu').value = c ? c.ChucVu : '';
    document.getElementById('ct_giayUyQuyenSo').value = c ? c.GiayUyQuyenSo : '';
    document.getElementById('ct_giayUyQuyenNgay').value = c ? toInputDate(c.GiayUyQuyenNgay) : '';
    document.getElementById('ct_nguoiLapBieu').value = c ? (c.NguoiLapBieu || '') : '';
  }

  function luuCongTyClick() {
    var payload = {
      maCty: MA_CTY_DANG_SUA || '',
      tenCty: document.getElementById('ct_tenCty').value.trim(),
      maCIF: document.getElementById('ct_maCIF').value.trim(),
      diaChiTruSo: document.getElementById('ct_diaChiTruSo').value.trim(),
      dienThoai: document.getElementById('ct_dienThoai').value.trim(),
      fax: document.getElementById('ct_fax').value.trim(),
      nguoiDaiDien: document.getElementById('ct_nguoiDaiDien').value.trim(),
      chucVu: document.getElementById('ct_chucVu').value.trim(),
      giayUyQuyenSo: document.getElementById('ct_giayUyQuyenSo').value.trim(),
      giayUyQuyenNgay: document.getElementById('ct_giayUyQuyenNgay').value,
      nguoiLapBieu: document.getElementById('ct_nguoiLapBieu').value.trim()
    };
    if (!payload.tenCty || !payload.diaChiTruSo) {
      baoLoi('Vui lòng nhập Tên công ty và Địa chỉ trụ sở chính.');
      return;
    }
    hienLoading(true);
    google.script.run.withSuccessHandler(function (res) {
      hienLoading(false);
      MA_CTY_DANG_SUA = res.maCty;
      baoThanhCong('Đã lưu công ty: ' + res.maCty);
      napDanhMucCoBan();
    }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).luuCongTy(payload);
  }

  function onKhachHangInput(inputEl) {
    var ten = inputEl.value.trim();
    var kh = DS_KHACH_HANG.filter(function (k) { return k.TenKhachHang === ten; })[0];
    if (!kh) return;
    var tr = inputEl.closest('tr');
    tr.querySelector('.ct-stk').value = kh.SoTaiKhoan || '';
    tr.querySelector('.ct-nh').value = kh.TaiNganHang || '';
  }

  var KH_DROPDOWN_INPUT = null;

  function moDanhSachKH(inputEl) {
    KH_DROPDOWN_INPUT = inputEl;
    renderDanhSachKH_(inputEl.value.trim());
  }

  function locDanhSachKH(inputEl) {
    KH_DROPDOWN_INPUT = inputEl;
    renderDanhSachKH_(inputEl.value.trim());
  }

  function renderDanhSachKH_(tuKhoa) {
    var dd = document.getElementById('ddKhachHang');
    if (!KH_DROPDOWN_INPUT || !dd) return;
    var tk = tuKhoa.trim().toUpperCase();
    var ds = DS_KHACH_HANG.filter(function (k) {
      if (!tk) return true;
      return String(k.TenKhachHang || '').toUpperCase().indexOf(tk) >= 0;
    });

    if (!ds.length) {
      dd.innerHTML = '<div class="kh-empty">Không có khách hàng khớp — vẫn có thể tự gõ tên mới.</div>';
    } else {
      dd.innerHTML = '';
      ds.forEach(function (k) {
        var item = document.createElement('div');
        item.className = 'kh-item';
        item.textContent = k.TenKhachHang + (k.MaSoThue ? ' — MST ' + k.MaSoThue : '');
        item.onmousedown = function (e) {
          e.preventDefault();
          chonKHTuDropdown_(k);
        };
        dd.appendChild(item);
      });
    }

    var rect = KH_DROPDOWN_INPUT.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.bottom + 2) + 'px';
    dd.style.width = Math.max(rect.width, 220) + 'px';
    dd.style.display = 'block';
  }

  function chonKHTuDropdown_(k) {
    if (!KH_DROPDOWN_INPUT) return;
    KH_DROPDOWN_INPUT.value = k.TenKhachHang;
    var tr = KH_DROPDOWN_INPUT.closest('tr');
    if (tr) {
      tr.querySelector('.ct-stk').value = k.SoTaiKhoan || '';
      tr.querySelector('.ct-nh').value = k.TaiNganHang || '';
    }
    dongDanhSachKH();
  }

  function dongDanhSachKH() {
    var dd = document.getElementById('ddKhachHang');
    if (dd) dd.style.display = 'none';
    KH_DROPDOWN_INPUT = null;
  }

  function apDungMauNoiDung(selEl) {
    var loai = selEl.value;
    if (!loai) return;
    var tr = selEl.closest('tr');
    var tlso = tr.querySelector('.ct-tlso').value.trim();
    var ngaytl = tr.querySelector('.ct-ngaytl').value.trim();
    var noidungInput = tr.querySelector('.ct-noidung');
    var tienTo = (loai === 'hang') ? 'Thanh toán tiền hàng theo hoá đơn' : 'Thanh toán chi phí theo hoá đơn';
    var phanHD = tlso ? ' số ' + tlso : '';
    var phanNgay = ngaytl ? ' ngày ' + ngaytl : '';
    noidungInput.value = tienTo + phanHD + phanNgay;
    selEl.value = '';
  }

  function onChonKhachHangEdit() {
    var sel = document.getElementById('selKhachHangEdit');
    if (!sel) return;
    var maKH = String(sel.value).trim();
    MA_KH_DANG_SUA = maKH;
    var k = DS_KHACH_HANG.filter(function (x) { return String(x.MaKH).trim() === maKH; })[0];
    document.getElementById('kh_tenKhachHang').value = k ? k.TenKhachHang : '';
    document.getElementById('kh_maSoThue').value = k ? k.MaSoThue : '';
    document.getElementById('kh_soTaiKhoan').value = k ? k.SoTaiKhoan : '';
    document.getElementById('kh_taiNganHang').value = k ? k.TaiNganHang : '';
    document.getElementById('kh_diaChi').value = k ? k.DiaChi : '';
    document.getElementById('kh_ghiChu').value = k ? k.GhiChu : '';
  }

  function luuKhachHangClick() {
    var payload = {
      maKH: MA_KH_DANG_SUA || '',
      tenKhachHang: document.getElementById('kh_tenKhachHang').value.trim(),
      maSoThue: document.getElementById('kh_maSoThue').value.trim(),
      soTaiKhoan: document.getElementById('kh_soTaiKhoan').value.trim(),
      taiNganHang: document.getElementById('kh_taiNganHang').value.trim(),
      diaChi: document.getElementById('kh_diaChi').value.trim(),
      ghiChu: document.getElementById('kh_ghiChu').value.trim()
    };
    if (!payload.tenKhachHang || !payload.soTaiKhoan || !payload.taiNganHang) {
      baoLoi('Vui lòng nhập Tên khách hàng, Số tài khoản và Ngân hàng.');
      return;
    }
    hienLoading(true);
    google.script.run.withSuccessHandler(function (res) {
      hienLoading(false);
      MA_KH_DANG_SUA = res.maKH;
      baoThanhCong('Đã lưu khách hàng: ' + res.maKH);
      napDanhMucCoBan();
    }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).luuKhachHang(payload);
  }

  function onChonHopDongEdit() {
    var sel = document.getElementById('selHopDongEdit');
    if (!sel) return;
    var maHD = String(sel.value).trim();
    MA_HD_DANG_SUA = maHD;
    var h = DS_HOP_DONG_ALL.filter(function (x) { return String(x.MaHD).trim() === maHD; })[0];
    document.getElementById('hd_maCty').value = h ? h.MaCty : '';
    document.getElementById('hd_soHopDong').value = h ? h.SoHopDong : '';
    document.getElementById('hd_ngayHopDong').value = h ? toInputDate(h.NgayHopDong) : '';
    document.getElementById('hd_tenNganHang').value = h ? (h.TenNganHang || '') : '';
    document.getElementById('hd_chiNhanh').value = h ? (h.ChiNhanh || '') : '';
    document.getElementById('hd_diaChiChiNhanh').value = h ? (h.DiaChiChiNhanh || '') : '';
    document.getElementById('hd_mstChiNhanh').value = h ? (h.MST_ChiNhanh || '') : '';

    var selCongTy = document.getElementById('selCongTy');
    if (!selCongTy) return;
    var maCty = String(selCongTy.value).trim(); // Bắt triệt để khoảng trắng
    var selHD = document.getElementById('selHopDong');
    if (selHD) { selHD.options.length = 0; selHD.add(new Option("-- Chọn hợp đồng --", "")); }
    
    var elHD = document.getElementById('thongBaoSoHopDong');
    if (elHD) elHD.textContent = '';

    document.getElementById('nguoiLapBieu').value = cty ? (cty.NguoiLapBieu || '') : '';
    
    // Nếu dropdown trống (lúc load trang), thoát luôn
    if (!maCty) { if (callback) callback(); return; }
    
    google.script.run.withSuccessHandler(function (list) {
      DS_HOP_DONG = list || [];
      DS_HOP_DONG.forEach(function (h) {
        var label = h.SoHopDong + ' - ' + (h.TenNganHang || '') + ' ' + (h.ChiNhanh || '');

    }).withFailureHandler(function (err) {
      if (elHD) elHD.innerHTML = '<b style="color:#b71c1c;">LỖI: ' + esc((err && err.message) || String(err)) + '</b>';

    var daGiaiNgan = TRANG_THAI_HIEN_TAI === 'Đã giải ngân';

      '#tab-hoso .card:nth-of-type(2) input, #tab-hoso .card:nth-of-type(2) select,' +

  function layGiaTriSo_(v) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[^0-9\-]/g, '');
    var n = parseInt(s, 10);
    return isNaN(n) ? 0 : n;
  }

  function toInputDate(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return '';
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  var TAI_LIEU_ROW_ID = '';
  var TAI_LIEU_DANH_SACH = [];

  function moChonTaiLieu(rowId) {
    var tr = document.getElementById(rowId);
    var ten = tr.querySelector('.ct-ten').value.trim();
    if (!ten) {
      baoLoi('Vui lòng nhập "Tên người hưởng" ở dòng này trước khi chọn tài liệu.');
      return;
    }
    TAI_LIEU_ROW_ID = rowId;
    document.getElementById('modalTaiLieuTitle').textContent = 'Chọn số hoá đơn — ' + ten;
    document.getElementById('modalTaiLieuBody').innerHTML =
      '<div class="loading" style="display:block;">Đang tải dữ liệu từ Sổ chi tiết mua hàng...</div>';
    document.getElementById('modalTaiLieu').style.display = 'flex';

    google.script.run.withSuccessHandler(function (list) {
      TAI_LIEU_DANH_SACH = list || [];
      renderDanhSachTaiLieu_();
    }).withFailureHandler(function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      document.getElementById('modalTaiLieuBody').innerHTML = '<div class="msg msg-err">Lỗi: ' + msg + '</div>';
    }).layDanhSachTaiLieuTheoNhaCungCap(ten, MA_HO_SO_DANG_SUA || '');

  function renderDanhSachTaiLieu_() {
    var body = document.getElementById('modalTaiLieuBody');
    if (!TAI_LIEU_DANH_SACH.length) {
      body.innerHTML = '<div class="msg msg-err">Không tìm thấy hoá đơn nào của nhà cung cấp này trong Sổ chi tiết mua hàng ' +
        '(có thể do tên chưa khớp với cột "nhacungcap", hoặc tất cả hoá đơn của nhà cung cấp này đã được dùng ở hồ sơ khác).</div>';
      return;
    }
    var html = '<div style="max-height:340px; overflow:auto;"><table class="detail"><thead><tr>' +
      '<th style="width:26px;"></th><th>Số hoá đơn</th><th>Ngày</th><th>Diễn giải</th><th style="text-align:right;">Giá trị (VND)</th>' +
      '</tr></thead><tbody>';
    TAI_LIEU_DANH_SACH.forEach(function (it, i) {
      html += '<tr>' +
        '<td style="text-align:center;"><input type="checkbox" class="chk-taillieu" data-idx="' + i + '"></td>' +
        '<td>' + esc(it.sohd) + '</td>' +
        '<td>' + esc(it.ngay) + '</td>' +
        '<td>' + esc(it.dienGiai) + '</td>' +
        '<td style="text-align:right;">' + (Number(it.giaTri) || 0).toLocaleString('vi-VN') + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    body.innerHTML = html;
  }

  function apDungChonTaiLieu() {
    var checked = Array.prototype.slice.call(document.querySelectorAll('.chk-taillieu:checked'));
    if (!checked.length) {
      baoLoi('Vui lòng chọn ít nhất 1 hoá đơn.');
      return;
    }
    checked.sort(function (a, b) { return Number(a.dataset.idx) - Number(b.dataset.idx); });
    var soHDs = [], ngays = [], tongGiaTri = 0;
    checked.forEach(function (chk) {
      var it = TAI_LIEU_DANH_SACH[Number(chk.dataset.idx)];
      if (!it) return;
      soHDs.push(it.sohd);
      ngays.push(it.ngay);
      tongGiaTri += Number(it.giaTri) || 0;
    });
    var tr = document.getElementById(TAI_LIEU_ROW_ID);
    if (tr) {
      tr.querySelector('.ct-tlso').value = soHDs.join(', ');
      tr.querySelector('.ct-ngaytl').value = ngays.join(', ');
      tr.querySelector('.ct-sotien').value = tongGiaTri.toLocaleString('vi-VN');
      capNhatTongTien();
    }
    dongModalTaiLieu();
  }

    TAI_LIEU_ROW_ID = '';
    TAI_LIEU_DANH_SACH = [];

    if (v === undefined || v === null) return '';
    return String(v).replace(/"/g, '&quot;');

    var soTienLanNay = layGiaTriSo_(document.getElementById('soTienNhanNoLanNay').value);

    document.querySelectorAll('#tbodyChiTiet tr').forEach(function (r) {
      var ten = r.querySelector('.ct-ten').value.trim();

        tenNguoiHuong: ten,

        taiNganHang: r.querySelector('.ct-nh').value.trim(),

        taiLieuSo: r.querySelector('.ct-tlso').value.trim(),
        ngayTaiLieu: r.querySelector('.ct-ngaytl').value.trim(),
        donViLapTaiLieu: ten
      });

    var taiLieuCM = document.getElementById('taiLieuChungMinhMucDich').value.trim() ||
      'Hóa đơn mua hàng và hợp đồng kinh tế đính kèm';

    return {
      maHoSo: MA_HO_SO_DANG_SUA || '',
      maHD: maHD,
      soGiayNhanNo: document.getElementById('soGiayNhanNo').value.trim(),
      ngayGiayNhanNo: document.getElementById('ngayGiayNhanNo').value,
      duNoHienTai: layGiaTriSo_(document.getElementById('duNoHienTai').value),
      soTienNhanNoLanNay: soTienLanNay,
      phuongThucThanhToan: document.getElementById('phuongThucThanhToan').value,
      mucDichSuDungVon: document.getElementById('mucDichSuDungVon').value.trim() || 'Bổ sung vốn lưu động',
      thoiHanChoVayNgay: document.getElementById('thoiHanChoVayNgay').value,
      ngayGiaiNgan: document.getElementById('ngayGiaiNgan').value,
      ngayDenHan: document.getElementById('ngayDenHan').value,
      taiLieuChungMinhMucDich: taiLieuCM,
      nguoiLapBieu: document.getElementById('nguoiLapBieu').value.trim(),
      soThamChieu: document.getElementById('soThamChieu').value.trim(),

  function luuHoSo(callback) {
    var payload = thuThapDuLieuForm();
    if (!payload) return;

    var tongThuHuong = payload.chiTiet.reduce(function (s, ct) { return s + (Number(ct.soTien) || 0); }, 0);
    if (!payload.chiTiet.length || tongThuHuong <= 0) {
      baoLoi('Vui lòng nhập Số tiền cho ít nhất 1 dòng thụ hưởng ở mục 4 trước khi lưu.');
      return;
    }

    var trung = timTrungThuHuong_(payload.chiTiet);
    if (trung.length) {
      hoiXacNhan('Phát hiện người thụ hưởng "' + trung.join('", "') + '" xuất hiện ở nhiều hơn 1 dòng trong hồ sơ này. ' +
        'Nếu đây là chủ ý thì cứ tiếp tục. Vẫn lưu?', function () {
          thucHienLuuHoSo_(payload, callback);
        });
      return;
    }
    thucHienLuuHoSo_(payload, callback);
  }

  function timTrungThuHuong_(chiTiet) {
    var dem = {}, trung = {};
    chiTiet.forEach(function (ct) {
      var key = String(ct.tenNguoiHuong || '').trim().toUpperCase() + '|' + String(ct.soTaiKhoan || '').trim();
      if (key === '|') return;
      dem[key] = (dem[key] || 0) + 1;
      if (dem[key] > 1) trung[ct.tenNguoiHuong] = true;
    });
    return Object.keys(trung);
  }

  function thucHienLuuHoSo_(payload, callback) {
    hienLoading(true);
    google.script.run.withSuccessHandler(function (res) {
      MA_HO_SO_DANG_SUA = res.maHoSo;
      TRANG_THAI_HIEN_TAI = res.trangThai || TRANG_THAI_HIEN_TAI || 'Nháp';
      capNhatTrangThaiHienThi_();
      apDungKhoaFormTheoTrangThai();
      FORM_DIRTY = false;
      baoThanhCong('Đã lưu hồ sơ: ' + res.maHoSo);
      locDanhSachHoSoClick();
      hienLoading(false);
      if (callback) callback(res.maHoSo);
    }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).luuHoSoGiaiNgan(payload);
  }

  // Hàm hỗ trợ: Loại bỏ dấu tiếng Việt để tìm kiếm chính xác tuyệt đối
function xoaDauVN(str) {
  if (!str) return '';
  return String(str)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .toLowerCase()
    .trim();
}

function locSelectTheoTuKhoa_(inputEl, selectId) {
  var tuKhoa = xoaDauVN(inputEl.value);
  var sel = document.getElementById(selectId);
  if (!sel) return;

  var nguon, placeholder, layNhan, maCotKhoa;
  if (selectId === 'selCongTyEdit') {
    nguon = DS_CONG_TY;
    placeholder = '-- Tạo công ty mới --';
    maCotKhoa = 'MaCty';
    layNhan = function (c) { return c.TenCty; };
  } else if (selectId === 'selHopDongEdit') {
    nguon = DS_HOP_DONG_ALL;
    placeholder = '-- Tạo hợp đồng mới --';
    maCotKhoa = 'MaHD';
    layNhan = function (h) {
      var congTy = DS_CONG_TY.filter(function (c) { return String(c.MaCty).trim() === String(h.MaCty).trim(); })[0];
      var ten = congTy ? congTy.TenCty : h.MaCty;
      return h.SoHopDong + ' - ' + ten;
    };
  } else {
    return;
  }

  var giaTriHienTai = sel.value;
  sel.options.length = 0;
  sel.add(new Option(placeholder, ""));
  
  (nguon || []).forEach(function (item) {
    var nhan = layNhan(item);
    // So sánh chuỗi đã được loại bỏ dấu
    if (tuKhoa && xoaDauVN(nhan).indexOf(tuKhoa) < 0) return;
    sel.add(new Option(nhan, item[maCotKhoa]));
  });

  // Giữ lại lựa chọn hiện tại nếu vẫn còn khớp bộ lọc
  var conKhop = Array.prototype.some.call(sel.options, function (opt) { return opt.value === giaTriHienTai; });
  sel.value = conKhop ? giaTriHienTai : '';
}

    var tbody = document.getElementById('bc_tbody') || document.querySelector('table tbody') || document.querySelector('#tab-baocao tbody');

    BC_DU_LIEU.forEach(function (r, i) {

      var soGNN = r.soGiayNhanNo || r.SoGiayNhanNo || '';
      var ngayNN = r.ngayNhanNo || r.NgayNhanNo || '';
      var ngayGN = r.ngayGiaiNgan || r.NgayGiaiNgan || '';
      var tenKH = r.tenNguoiHuong || r.TenNguoiHuong || '';
      var soTien = Number(r.soTienVay || r.SoTienVay || r.SoTien || 0);
      var soTL = r.soTaiLieu || r.TaiLieuSo || '';
      var ngayTL = r.ngayTaiLieu || r.NgayTaiLieu || '';
      var ngayDH = r.ngayDenHan || r.NgayDenHan || '';

      var trangThaiStr = String(r.trangThai || r.TrangThai || '').trim();

      tong += soTien;
      var lopTrangThai = (trangThaiStr === 'Đã giải ngân') ? 'trangthai-daigiaingan' : 'trangthai-daotaohoso';

      var tr = document.createElement('tr');
      tr.innerHTML = 
        '<td style="text-align:center;">' + (i + 1) + '</td>' +
        '<td><b>' + esc(maHS) + '</b></td>' +
        '<td>' + esc(soHD) + '</td>' +
        '<td>' + esc(soGNN) + '</td>' +
        '<td style="text-align:center;">' + esc(ngayNN) + '</td>' +
        '<td style="text-align:center;">' + esc(ngayGN) + '</td>' +
        '<td>' + esc(tenKH) + '</td>' +

        '<td>' + esc(soTL) + '</td>' +
        '<td style="text-align:center;">' + esc(ngayTL) + '</td>' +
        '<td style="text-align:center;">' + esc(ngayDH) + '</td>' +
        '<td style="text-align:center;">' + esc(laiSuat) + '</td>' +
        '<td style="text-align:center;"><span class="trangthai-badge ' + lopTrangThai + '">' + esc(trangThaiStr) + '</span></td>';
      tbody.appendChild(tr);
    });
    
    var elTongTien = document.getElementById('bc_tongTien');
    if (elTongTien) elTongTien.textContent = tong.toLocaleString('vi-VN');
  }

function taoBangKeUNCTheoMau(maHoSo) {
  var data = layDuLieuDayDu(maHoSo);
  var hoSo = data.hoSo, chiTiet = data.chiTiet || [];

  var folder = layThuMucXuatTheoMau_(maHoSo);
  var tenFile = tenFileTheoMau_('BangKe_UNC_4lien', maHoSo);
  var copy = DriveApp.getFileById(TEMPLATE_BANGKE_UNC_4LIEN_ID).makeCopy(tenFile, folder);
  var ss = SpreadsheetApp.openById(copy.getId());
  var sh = ss.getSheets()[0];

  sh.getRange('A2').setValue('Số tham chiếu LTT: ' + (hoSo.SoThamChieu || ''));

  var dongDauDuLieu = 7, soDongMau = 2;
  var soDongCanCo = Math.max(chiTiet.length, 1);
  var chenhLech = dieuChinhSoDongBang_(sh, dongDauDuLieu, soDongMau, soDongCanCo);

  var rows = [];
  var tong = 0;
  chiTiet.forEach(function (ct, i) {
    var tien = Number(ct.SoTien) || 0;
    tong += tien;
    rows.push([i + 1, ct.SoTaiKhoan || '', 'VND', ct.TenNguoiHuong || '', tien, ct.NoiDungThanhToan || '',
      ct.ChuyenTienNhanh_24_7 === 'Y' ? 'Y' : 'N', ct.TaiNganHang || '', ct.NgayCapGiayToTuyThan || '', ct.GhiChu || '']);
  });
  if (!rows.length) rows.push(['', '', 'VND', '', 0, '', 'N', '', '', '']);
  var vungDuLieu = sh.getRange(dongDauDuLieu, 1, rows.length, 10);
  vungDuLieu.setValues(rows);

  var dongTongCong = dongDauDuLieu + soDongCanCo;
  sh.getRange(dongTongCong, 1).setValue('Tổng cộng');
  sh.getRange(dongTongCong, 5).setValue(tong);

  var dongNguoiLap = 18 + chenhLech;
  sh.getRange('B' + dongNguoiLap).setValue(hoSo.NguoiLapBieu || '');

  // ===== Kẻ khung + canh lề + cỡ chữ cho toàn bộ vùng dữ liệu (kể cả dòng tổng) =====
  var vungKeKhung = sh.getRange(dongDauDuLieu, 1, soDongCanCo + 1, 10); // +1 để gồm cả dòng "Tổng cộng"
  vungKeKhung.setBorder(true, true, true, true, true, true);
  vungKeKhung.setFontSize(10);
  sh.getRange(dongDauDuLieu, 1, soDongCanCo, 1).setHorizontalAlignment('center'); // cột STT
  sh.getRange(dongDauDuLieu, 5, soDongCanCo, 1).setHorizontalAlignment('right');  // cột Số tiền
  sh.getRange(dongTongCong, 1, 1, 10).setFontWeight('bold');

  SpreadsheetApp.flush();
  var pdfUrl = xuatPdfTheoMauSheet_(copy.getId(), sh.getSheetId(), tenFile, folder,
    { hangCuoi: dongTongCong + 2, cotCuoi: 10 });
  return { sheetUrl: copy.getUrl(), pdfUrl: pdfUrl, ten: tenFile };
};
